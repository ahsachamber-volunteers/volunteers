<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة إدارة المتطوعين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* لوحة تشغيل الفعاليات: خلفية رمادية مائلة للأزرق البترولي، بطاقات بيضاء، لون أساسي بترولي، ألوان حالة مستقلة (حاضر/استراحة/حرج) */
:root{
  --bg:#edf1f2;
  --surface:#ffffff;
  --surface-2:#f5f8f9;
  --ink:#122129;
  --muted:#5a6a73;
  --line:#d8e1e4;
  --accent:#0d5a70;
  --accent-ink:#ffffff;
  --accent-soft:#dfeef2;
  --ok:#15803d; --ok-soft:#dcf5e4;
  --warn:#b45309; --warn-soft:#fdf0d5;
  --crit:#b91c1c; --crit-soft:#fde3e3;
  --info:#2f5fb3; --info-soft:#e2ebfa;
  --idle:#64748b; --idle-soft:#e7ecef;
  --praise:#7c3aed; --praise-soft:#efe8fd;
  --font-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --font-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --r:12px;
  --shadow:0 1px 2px rgba(18,33,41,.05),0 6px 18px rgba(18,33,41,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1619; --surface:#142126; --surface-2:#192a30; --ink:#e6eef0; --muted:#93a6ad; --line:#26393f;
    --accent:#4fb3cc; --accent-ink:#06222a; --accent-soft:#163640;
    --ok:#4ade80; --ok-soft:#123222; --warn:#fbbf24; --warn-soft:#3a2b0c; --crit:#f87171; --crit-soft:#3d1717;
    --info:#7aa7f0; --info-soft:#18284a; --idle:#94a3b8; --idle-soft:#1f2d33; --praise:#b79cf7; --praise-soft:#2a1f45;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1619; --surface:#142126; --surface-2:#192a30; --ink:#e6eef0; --muted:#93a6ad; --line:#26393f;
  --accent:#4fb3cc; --accent-ink:#06222a; --accent-soft:#163640;
  --ok:#4ade80; --ok-soft:#123222; --warn:#fbbf24; --warn-soft:#3a2b0c; --crit:#f87171; --crit-soft:#3d1717;
  --info:#7aa7f0; --info-soft:#18284a; --idle:#94a3b8; --idle-soft:#1f2d33; --praise:#b79cf7; --praise-soft:#2a1f45;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;line-height:1.3;text-wrap:balance;font-weight:600}
h1{font-size:1.25rem}h2{font-size:1.1rem}h3{font-size:1rem}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;font-family:var(--font-display)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.tiny{font-size:.76rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:.9rem;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.warn{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.crit{background:var(--crit);border-color:var(--crit);color:#fff}
:root[data-theme="dark"] .btn.ok,:root[data-theme="dark"] .btn.warn,:root[data-theme="dark"] .btn.crit{color:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.ok,:root:not([data-theme="light"]) .btn.warn,:root:not([data-theme="light"]) .btn.crit{color:#111}}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:5px 10px;font-size:.8rem;border-radius:8px}
.btn.lg{padding:14px 20px;font-size:1.05rem;border-radius:14px}
.btn.block{width:100%}
.icon{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.nodot::before{display:none}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.idle{background:var(--idle-soft);color:var(--idle)}
.pill.praise{background:var(--praise-soft);color:var(--praise)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}

/* inputs */
.field{display:grid;gap:4px}
.field label{font-size:.82rem;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;min-height:40px}
textarea.input{min-height:80px;resize:vertical}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:7px;cursor:pointer;font-size:.82rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-b{padding:14px 16px}
.stack{display:grid;gap:16px}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:6px 0 2px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* shell */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100%}
.side{background:var(--surface);border-inline-start:0;border-inline-end:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand b{font-family:var(--font-display);font-size:1rem;display:block}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:600;cursor:pointer;border:0;background:transparent;width:100%;text-align:start}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav-item .badge{margin-inline-start:auto}
.badge{background:var(--crit);color:#fff;border-radius:999px;font-size:.7rem;padding:1px 7px;font-weight:700}
.side-foot{margin-top:auto;display:grid;gap:8px;padding:8px}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.top .sub{font-size:.8rem;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--ok);font-weight:600}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.view{padding:20px 22px 110px;display:grid;gap:18px;max-width:1400px;width:100%}
.banner{margin:14px 22px 0;padding:10px 14px;border-radius:10px;font-size:.86rem;display:flex;gap:10px;align-items:center}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.info{background:var(--info-soft);color:var(--info)}
.bottom{display:none}
.m-only{display:none!important}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .top{padding:12px 16px}
  .view{padding:16px 16px 110px}
  .banner{margin:12px 16px 0}
  .m-only{display:inline-flex!important}
  .bottom{display:grid;grid-template-columns:repeat(7,1fr);position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);z-index:30;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bottom button{border:0;background:transparent;display:grid;justify-items:center;gap:2px;font-size:.66rem;font-weight:600;color:var(--muted);padding:6px 0;cursor:pointer;position:relative}
  .bottom button[aria-current="page"]{color:var(--accent)}
  .bottom .badge{position:absolute;top:0;inset-inline-end:18%}
}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--k,var(--accent))}
.kpi .v{font-family:var(--font-display);font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .l{font-size:.8rem;color:var(--muted);font-weight:600}

/* zones */
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.zone{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.zone-top{height:5px;background:var(--zc)}
.zone-in{padding:14px;display:grid;gap:12px}
.zone-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.zone-head h3{display:flex;align-items:center;gap:8px}
.zdot{width:10px;height:10px;border-radius:3px;background:var(--zc);flex:none}
.staff{display:flex;align-items:baseline;gap:6px}
.staff .big{font-family:var(--font-display);font-size:2rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:99px}
.bar.warn>i{background:var(--warn)}.bar.crit>i{background:var(--crit)}
.crowd{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.crowd button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:5px 0;font-size:.74rem;font-weight:600;cursor:pointer;color:var(--muted)}
.crowd button[aria-pressed="true"].l0{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.crowd button[aria-pressed="true"].l1{background:var(--info-soft);color:var(--info);border-color:var(--info)}
.crowd button[aria-pressed="true"].l2{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.crowd button[aria-pressed="true"].l3{background:var(--crit-soft);color:var(--crit);border-color:var(--crit)}
.zone.hot{border-color:var(--crit);box-shadow:0 0 0 2px var(--crit-soft),var(--shadow)}

/* lists */
.list{display:grid}
.li{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:11px 16px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li.click{cursor:pointer}
.li.click:hover{background:var(--surface-2)}
.av{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-family:var(--font-display);color:#fff;background:var(--zc,var(--idle));flex:none;font-size:.9rem}
.li .t{font-weight:600}
.li .grow{min-width:min(190px,100%)}
.li .s{font-size:.8rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.people-row{display:grid;grid-template-columns:minmax(180px,2fr) 1.2fr 1.3fr .8fr .8fr auto;align-items:center;gap:12px}
@media (max-width:760px){.people-row{grid-template-columns:1fr auto}.people-row .hide-m{display:none}}
.stars{color:#e0a100;letter-spacing:1px;font-size:.85rem}
.stars .off{color:var(--line)}

/* board */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;align-items:start}
.col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.col-h{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:4px solid var(--zc)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px;min-height:56px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:5px 9px;font-size:.82rem;font-weight:600;cursor:pointer;user-select:none}
.chip .d{width:8px;height:8px;border-radius:50%;background:var(--idle)}
.chip.st-active .d{background:var(--ok)}.chip.st-break .d{background:var(--warn)}.chip.st-out{opacity:.55}
.chip.overdue{border-color:var(--crit);color:var(--crit)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip[aria-pressed="true"] .d{box-shadow:0 0 0 2px var(--accent-ink)}
.chip.lead::after{content:"★";font-size:.7rem;color:#e0a100}
.actionbar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 24px);justify-content:center}
.actionbar .btn{border-color:transparent}
.actionbar .btn:not(.primary):not(.ok):not(.warn):not(.ghost){color:var(--ink)}
.actionbar select{background:var(--surface);color:var(--ink);border-radius:8px;border:0;padding:6px 8px}
@media (max-width:900px){.actionbar{bottom:78px}}

/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(8,18,22,.45);z-index:60;display:none}
.scrim.open{display:block}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(480px,100%);background:var(--bg);z-index:70;transform:translateX(-105%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.2)}
[dir="rtl"] .drawer{inset-inline-end:auto;left:0}
.drawer.open{transform:none}
.drawer-h{padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.drawer-b{overflow:auto;padding:16px;display:grid;gap:14px;align-content:start;flex:1}
.modal{position:fixed;z-index:80;top:50%;left:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 24px));max-height:calc(100% - 40px);overflow:auto;background:var(--surface);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:none}
.modal.open{display:block}
.modal-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.modal-b{padding:16px 18px;display:grid;gap:12px}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-start;flex-wrap:wrap}
.toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:100;display:grid;gap:8px;width:min(420px,calc(100% - 24px))}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:.88rem;box-shadow:0 8px 24px rgba(0,0,0,.25);border-inline-start:4px solid var(--accent)}
.toast.ok{border-color:var(--ok)}.toast.crit{border-color:var(--crit)}.toast.warn{border-color:var(--warn)}

/* stats in drawer */
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.mini>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.mini b{display:block;font-family:var(--font-display);font-size:1.15rem;font-variant-numeric:tabular-nums}
.mini span{font-size:.74rem;color:var(--muted);font-weight:600}
.timeline{display:grid;gap:0}
.tl{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:.85rem}
.tl:last-child{border-bottom:0}
.tl .when{color:var(--muted);font-variant-numeric:tabular-nums;min-width:52px}
.note{border:1px solid var(--line);border-inline-start:4px solid var(--info);background:var(--surface);border-radius:10px;padding:9px 12px;display:grid;gap:4px}
.note.praise{border-inline-start-color:var(--praise)}.note.award{border-inline-start-color:var(--ok)}
.stks{display:flex;flex-wrap:wrap;gap:12px}
.stk{display:grid;justify-items:center;gap:4px;width:72px;text-align:center}
.stk-c{border-radius:50%;display:grid;place-items:center;color:#fff;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.35),transparent 55%),var(--sc);box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--sc),0 4px 10px rgba(0,0,0,.15);transform:rotate(-6deg)}
.stk.off .stk-c{background:var(--surface-2);color:var(--muted);box-shadow:0 0 0 2px var(--line);transform:none;border:2px dashed var(--line)}
.em-panel{margin:14px 22px 0;background:var(--crit);color:#fff;border-radius:14px;padding:14px 16px;display:grid;gap:12px;box-shadow:0 8px 24px rgba(185,28,28,.3)}
:root[data-theme="dark"] .em-panel{color:#1a0505}
.em-panel .btn{background:rgba(255,255,255,.95);color:var(--crit);border-color:transparent}
.em-counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.em-counts>div{background:rgba(255,255,255,.16);border-radius:10px;padding:8px 10px;font-size:.8rem;font-weight:600}
.em-counts b{display:block;font-family:var(--font-display);font-size:1.6rem;line-height:1.1}
.em-roll{background:var(--surface);color:var(--ink);border-radius:10px;padding:10px;display:grid;gap:10px}
.chip.safe{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.chip.help{background:var(--crit-soft);color:var(--crit);border-color:var(--crit)}
.em-screen{position:fixed;inset:0;z-index:95;background:#7f1d1d;color:#fff;display:grid;place-items:center;padding:24px 18px;overflow:auto}
.em-in{width:min(460px,100%);display:grid;gap:16px;text-align:center}
.em-in .icon{width:64px;height:64px;justify-self:center;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
.em-type{font-family:var(--font-display);font-size:1.6rem;font-weight:700}
.em-msg{font-size:1.1rem;line-height:1.7;margin:0}
.em-point{background:rgba(255,255,255,.14);border-radius:14px;padding:14px;display:grid;gap:4px}
.em-point b{font-family:var(--font-display);font-size:1.4rem}
.em-in .btn.lg{padding:18px;font-size:1.15rem;border:0}
.em-safe{background:#22c55e!important;color:#052e12!important}
.em-help{background:#fff!important;color:#7f1d1d!important}
.mission{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;background:var(--surface)}
.mission.urgent{border-color:var(--crit);box-shadow:0 0 0 2px var(--crit-soft)}
.mission.mine{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.ai-log{max-height:52vh;overflow:auto;display:grid;gap:10px;padding:2px}
.ai-msg{border-radius:12px;padding:10px 12px;font-size:.92rem;line-height:1.7}
.ai-msg.user{background:var(--accent-soft);color:var(--accent);justify-self:start;font-weight:600;max-width:85%}

  color-scheme:dark;background:var(--bg);color:var(--ink);min-height:100%;padding:18px 22px;display:grid;gap:16px;align-content:start}

.wz{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--zc);border-radius:14px;padding:14px;display:grid;gap:8px}
.wz.hot{border-color:var(--crit);box-shadow:0 0 0 2px var(--crit);animation:glow 2s ease-in-out infinite}

.wall-side{display:grid;gap:12px}
.wall-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:8px}

.gold-banner{background:linear-gradient(90deg,#92400e,#d97706,#facc15,#d97706,#92400e);background-size:300% 100%;animation:shine 4s linear infinite;color:#1c0f02;border-radius:12px;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:600;box-shadow:0 6px 18px rgba(217,119,6,.35)}

.ticker{max-width:100%;overflow:hidden;background:var(--ink);color:var(--bg);border-radius:10px;white-space:nowrap}

.box-card{background:linear-gradient(135deg,#7c3aed,#db2777);color:#fff;border-radius:16px;padding:16px;display:flex;gap:14px;align-items:center}

.flame{display:inline-flex;align-items:center;gap:6px;font-weight:700}

  Object.values(S.logs).filter(l=>l.type==='in').sort((a,b)=>a.at-b.at).forEach(l=>{ const d=dayStart(l.at); ins[d]=ins[d]||[]; if(ins[d].length<5 && !ins[d].includes(l.v)){ ins[d].push(l.v); early.add(l.v); } });

  const L = idx().byV[vid] || []; let total=0, start=null;
  for(const l of L){
    if(l.type==='in' || l.type==='break_end') start=l.at;

  }

    if(l.type==='in' || l.type==='break_end') start=l.at;

    gb += Math.floor(workedSince(vid,a,e)/360000)*PTS.hour/10;
    gb += L.filter(l=>l.type==='move' && (l.crowd??0)>=2 && l.at>=a && l.at<=e).length*PTS.crowd;
    gb += ontimeAts.filter(t=>t>=a && t<=e).length*PTS.ontime;
    gb += myM.filter(m=>m.doneAt>=a && m.doneAt<=e).reduce((t,m)=>t+(m.pts||0),0);
    gb += foundL.filter(x=>x.foundAt>=a && x.foundAt<=e).length*PTS.finder;
    gb += praise.filter(n=>n.at>=a && n.at<=e).length*PTS.praise;
  }

  const pBeforeBox=p;
  const boxes=notes.filter(n=>n.kind==='box'); add('box','صناديق المفاجآت', boxes.reduce((t,n)=>t+(n.reward?.pts||0),0));
  const boxEarned=Math.floor(pBeforeBox/BOX_EVERY);
  const zonesWorked=new Set(L.filter(l=>l.zone).map(l=>l.zone)); if(v.zone) zonesWorked.add(v.zone);
  const b={
    early: idx().early.has(vid), punctual: ontime>=1 && late===0 && !isOverdue({...v,id:vid}), crowd: crowdMoves>0,
    marathon: w>=4*3600000, star: notes.some(n=>n.stars===5), thanks: praise.length>0, eye: reports>0, multi: zonesWorked.size>=3, faz3a: myM.length>0, finder: foundL.length>0,
    lucky: boxes.some(n=>n.reward?.badge==='lucky'),
  };
  const badges=BADGES.filter(x=>b[x.id]).map(x=>x.id);
  awards.forEach(a=>badges.push('aw:'+a.id));
  const legends=LEGENDS.filter(lg=>(S.legend[lg.id]?.claims||[]).some(c=>c.v===vid)).map(l=>l.id);
  let li=0; LEVELS.forEach((l,i)=>{ if(p>=l.min) li=i; });
  const next=LEVELS[li+1];
  return {p:Math.round(p), br, badges, awards, legends, crowdMoves, missions:myM.length, ontime, late, w, streak, maxStreak, milestones,
    boxAvail:Math.max(0, boxEarned-boxes.length), boxes:boxes.length, nextBoxIn: BOX_EVERY-(pBeforeBox%BOX_EVERY),
    level:LEVELS[li], li, next, prog: next ? (p-LEVELS[li].min)/(next.min-LEVELS[li].min) : 1};
}

function breakToday(vid){

function zoneStats(){
  const all = vols();
  return zones().map(z=>{
    const inZ = all.filter(v=>v.zone===z.id);
    const active = inZ.filter(v=>v.status==='active');
    const onBreak = inZ.filter(v=>v.status==='break');
    const idle = inZ.filter(v=>v.status==='idle');
    const need = Math.max(0, Math.ceil((z.target||0) * CROWD[z.crowd??1].m));
    return {z, all:inZ, active, onBreak, idle, need, gap: need - active.length};
  });
}
function suggestions(){
  const st = zoneStats();
  const recv = st.filter(s=>s.gap>0).sort((a,b)=>(b.z.crowd??1)-(a.z.crowd??1) || b.gap-a.gap);
  const donors = st.filter(s=>s.gap<0).map(s=>({zid:s.z.id, crowd:s.z.crowd??1, surplus:-s.gap,
    pool:s.active.filter(v=>v.role!=='قائد فريق').sort((a,b)=>(a.zoneAt||0)-(b.zoneAt||0))}));
  const loose = vols().filter(v=>v.status==='active' && !zoneById(v.zone));
  if(loose.length) donors.unshift({zid:'', crowd:-1, surplus:loose.length, pool:loose});
  const moves=[];
  for(const r of recv){
    let need=r.gap;
    while(need>0){
      const d = donors.filter(d=>d.surplus>0 && d.pool.length && d.crowd < (r.z.crowd??1)+1).sort((a,b)=>a.crowd-b.crowd || b.surplus-a.surplus)[0];
      if(!d) break;
      const v=d.pool.shift(); d.surplus--; need--;
      moves.push({vid:v.id, from:d.zid, to:r.z.id});
    }
  }
  return moves;
}
function pullCandidates(toZone, n){
  const target = zoneById(toZone); const tc = target?.crowd??1;
  const st = Object.fromEntries(zoneStats().map(s=>[s.z.id,s]));
  const cand = vols().filter(v=>v.status==='active' && v.zone!==toZone && v.role!=='قائد فريق')
    .map(v=>{ const s=st[v.zone]; return {v, crowd: s? (s.z.crowd??1) : -1, surplus: s? -s.gap : 99}; })
    .filter(c=>c.crowd < tc)
    .sort((a,b)=> b.surplus-a.surplus || a.crowd-b.crowd);
  const picked=[], used={};
  for(const c of cand){ if(picked.length>=n) break; const k=c.v.zone||'_'; const s=st[c.v.zone]; const left = s ? s.active.length-(used[k]||0) : 99; if(s && left<=1) continue; used[k]=(used[k]||0)+1; picked.push(c.v); }
  return picked;
}
function breakAllowed(vid){
  const v=S.volunteers[vid]; if(!v) return false;
  const inZ = vols().filter(x=>x.zone===v.zone && (x.status==='active'||x.status==='break'));
  const onB = inZ.filter(x=>x.status==='break').length;
  const max = Math.max(1, Math.floor(inZ.length * (cfg().maxBreakPct||25)/100));
  return onB < max;
}

function addLog(vid, type, extra={}){ const v=S.volunteers[vid]; return put('logs', uid('l'), {v:vid, type, zone:v?.zone||'', at:now(), ...extra}); }
function setStatus(vid, status, by='admin', meta={}){
  const cur=S.volunteers[vid]; if(!cur || cur.status===status) return;
  const v={...cur}; const t=now(); const prev=v.status;
  if(status==='active'){
    if(prev==='break'){ addLog(vid,'break_end',{by}); }
    else { v.checkInAt=t; addLog(vid,'in',{by,...meta}); }
    v.activeSince=t; delete v.breakAt;
  } else if(status==='break'){
    if(prev!=='active'){ v.checkInAt=t; addLog(vid,'in',{by,...meta}); }
    v.breakAt=t; addLog(vid,'break_start',{by});
  } else if(status==='out'){
    if(prev==='break') addLog(vid,'break_end',{by});
    if(prev==='idle') return;
    addLog(vid,'out',{by}); v.outAt=t; delete v.breakAt;
  } else if(status==='idle'){ delete v.breakAt; }
  v.status=status; v.statusAt=t; if(status!=='active') delete v.breakReq;
  return put('volunteers', vid, v);
}
function moveVol(vid, zone, by='admin'){
  const cur=S.volunteers[vid]; if(!cur || cur.zone===zone) return;
  const from=cur.zone||''; put('volunteers', vid, {...cur, zone, zoneAt:now()});

}

const peaks = () => (cfg().peaks||[]).slice().sort((a,b)=>peakTime(a)-peakTime(b));
function peakTime(p){ const [h,m]=String(p.time||'0:0').split(':').map(Number); const d=new Date(); d.setHours(h||0,m||0,0,0); return d.getTime(); }
function peakState(p){ const mins=(peakTime(p)-now())/60000; if(mins< -45) return 'past'; if(mins<=0) return 'live'; if(mins<=(p.lead||30)) return 'soon'; return 'later'; }
const peakSoon = zone => peaks().find(p=>p.zone===zone && ['soon','live'].includes(peakState(p)));
const breakQueue = zone => vols().filter(v=>v.breakReq && v.zone===zone && v.status==='active').sort((a,b)=>a.breakReq-b.breakReq);
const queuePos = vid => { const v=S.volunteers[vid]; const q=breakQueue(v?.zone); const i=q.findIndex(x=>x.id===vid); return i<0 ? q.length+1 : i+1; };
function canBreakNow(vid){
  const v=S.volunteers[vid]; if(!v || v.status!=='active') return {ok:false, reason:'state'};
  if(breakLeft(vid)<=0) return {ok:false, reason:'budget'};
  const pk=peakSoon(v.zone); if(pk) return {ok:false, reason:'peak', pk};
  if(!breakAllowed(vid)) return {ok:false, reason:'full'};
  const q=breakQueue(v.zone); if(q.length && q[0].id!==vid) return {ok:false, reason:'queue'};
  return {ok:true};
}
function requestBreak(vid, by){
  const c=canBreakNow(vid);
  if(c.ok){ setStatus(vid,'break',by); return {started:true}; }
  if(c.reason==='budget' || c.reason==='state') return c;
  const v=S.volunteers[vid]; if(!v.breakReq) put('volunteers',vid,{...v,breakReq:now()});
  return {...c, queued:true, pos:queuePos(vid)};
}

function chalScore(type, mem){
  const ds=dayStart();
  if(type==='nolate'){ const late=mem.some(v=>breakLeft(v.id)<0); const h=mem.reduce((s,v)=>s+workedSince(v.id,ds),0)/3600000; return {score: late?0:100+h, val: late?'خرج من التحدي (تجاوز استراحة)':`${h.toFixed(1)} ساعة بدون أي تأخير`}; }
  if(type==='missions'){ const ids=new Set(mem.map(v=>v.id)); let n=0; missions().filter(m=>m.status==='done' && (m.doneAt||0)>=ds).forEach(m=>(m.takers||[]).forEach(x=>{ if(ids.has(x)) n++; })); return {score:n, val:`${n} مشاركة في مهام`}; }
  if(type==='praise'){ const n=mem.reduce((s,v)=>s+(idx().notesByV[v.id]||[]).filter(x=>(x.kind==='praise'||x.kind==='award') && x.at>=ds).length,0); return {score:n, val:`${n} إشادة ومكافأة`}; }
  if(type==='punctual'){ const w=mem.filter(v=>v.shiftStart); if(!w.length) return {score:0,val:'لا توجد ورديات'}; const ok=w.filter(v=>{ const f=firstInToday(v.id); return f && f.at<=hmToday(v.shiftStart)+5*60000; }).length; const pct=Math.round(ok/w.length*100); return {score:pct, val:`${pct}% حضروا في الوقت`}; }
  const h=mem.length ? mem.reduce((s,v)=>s+workedSince(v.id,ds),0)/mem.length/3600000 : 0; return {score:h, val:`${h.toFixed(1)} ساعة للفرد`};
}

  const P=Array.from({length:n},()=>({x:W/2+(Math.random()-.5)*W*.4, y:H*.4, vx:(Math.random()-.5)*16, vy:-Math.random()*15-5, s:6+Math.random()*7, r:Math.random()*6, vr:(Math.random()-.5)*.3, c:cols[Math.floor(Math.random()*cols.length)]}));

function ibanOk(raw){ const s=String(raw||'').replace(/\s+/g,'').toUpperCase(); if(!/^SA\d{22}$/.test(s)) return false; const r=s.slice(4)+s.slice(0,4); const n=r.replace(/[A-Z]/g,c=>c.charCodeAt(0)-55); let m=0; for(const ch of n) m=(m*10+(+ch))%97; return m===1; }
const fmtIban = s => String(s||'').replace(/\s+/g,'').toUpperCase().replace(/(.{4})/g,'$1 ').trim();
const dayFromKey = k => { const d=new Date(+k.slice(0,4), +k.slice(4,6)-1, +k.slice(6,8)); return d.getTime(); };
const fmtKey = k => `${k.slice(6,8)}/${k.slice(4,6)}`;

const BRAND_COLORS=['#0d5a70','#1d4ed8','#6d28d9','#be185d','#b91c1c','#c2410c','#a16207','#15803d','#0f766e','#334155'];
const brandCfg = () => cfg().brand || {};
const logoUrl = () => brandCfg().logo || '';
function hexLum(h){ const m=String(h).replace('#',''); if(m.length!==6) return 0.2; const [r,g,b]=[0,2,4].map(i=>{ let c=parseInt(m.slice(i,i+2),16)/255; return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4); }); return 0.2126*r+0.7152*g+0.0722*b; }
let BRAND_SIG='';
function applyBrand(){
  const b=brandCfg(); const sig=JSON.stringify([b.color,b.theme,b.logo?1:0]); if(sig===BRAND_SIG) return; BRAND_SIG=sig;
  const root=document.documentElement;
  if(b.theme==='light'||b.theme==='dark') root.setAttribute('data-theme', b.theme); else root.removeAttribute('data-theme');
  const dark = b.theme==='dark' || (b.theme!=='light' && matchMedia('(prefers-color-scheme: dark)').matches);
  if(b.color){
    const c=b.color; const accent = dark ? `color-mix(in srgb, ${c} 65%, white)` : c;
    root.style.setProperty('--accent', accent);
    root.style.setProperty('--accent-soft', `color-mix(in srgb, ${c} ${dark?28:14}%, ${dark?'#142126':'#ffffff'})`);
    root.style.setProperty('--accent-ink', dark ? '#06141a' : (hexLum(c)>0.45?'#111111':'#ffffff'));
  } else { ['--accent','--accent-soft','--accent-ink'].forEach(k=>root.style.removeProperty(k)); }
  let fav=document.querySelector('link[rel=icon]'); if(b.logo){ if(!fav){ fav=document.createElement('link'); fav.rel='icon'; document.head.appendChild(fav); } fav.href=b.logo; }
}
const brandMark = () => logoUrl() ? `<span class="brand-mark has-logo"><img src="${logoUrl()}" alt="الشعار"></span>` : `<span class="brand-mark">${ic('crowd')}</span>`;

function readLogo(file){
  return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onerror=rej; fr.onload=()=>{ const im=new Image(); im.onerror=rej; im.onload=()=>{ const max=240; const k=Math.min(1,max/Math.max(im.width,im.height)); const cv=document.createElement('canvas'); cv.width=Math.round(im.width*k); cv.height=Math.round(im.height*k); cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height); let url=cv.toDataURL('image/png'); if(url.length>180000) url=cv.toDataURL('image/jpeg',0.85); res(url); }; im.src=fr.result; }; fr.readAsDataURL(file); });
}

const kpi = (v,l,c) => `<div class="kpi" style="--k:${c}"><span class="v">${v}</span><span class="l">${l}</span></div>`;
function zoneCard(s){
  const z=s.z, cr=z.crowd??1; const pct = s.need ? Math.min(100, Math.round(s.active.length/s.need*100)) : 100;
  const barC = s.gap>=2 || (s.gap>0 && cr>=2) ? 'crit' : s.gap>0 ? 'warn' : '';
  const gapPill = s.gap>0 ? `<span class="pill crit num">ينقصها ${s.gap}</span>` : s.gap<0 ? `<span class="pill ok num">فائض ${-s.gap}</span>` : `<span class="pill info">مكتملة</span>`;
  const leads = s.all.filter(v=>v.role==='قائد فريق').map(v=>v.name);
  return `<article class="zone ${cr===3&&s.gap>0?'hot':''}" style="--zc:${esc(z.color)}"><div class="zone-top"></div><div class="zone-in">
    <div class="zone-head"><div><h3><span class="zdot"></span>${esc(z.name)}</h3>${leads.length?`<div class="tiny muted">القائد: ${esc(leads.join('، '))}</div>`:''}</div>${gapPill}</div>
    <div class="staff"><span class="big">${s.active.length}</span><span class="muted">/ ${s.need} مطلوب</span></div>
    <div class="bar ${barC}"><i style="width:${pct}%"></i></div>
    ${(()=>{ const e=zoneEnergy(s.all); return e?`<div class="row small"><span class="muted">طاقة الفريق</span>${energyBar(e.avg<1.7?1:e.avg<2.4?2:3)}<span class="${e.avg<1.7?'':'muted'}" style="${e.avg<1.7?'color:var(--crit);font-weight:600':''}">${e.avg<1.7?'منهك':e.avg<2.4?'متوسطة':'عالية'}</span></div>`:''; })()}
    ${(()=>{ const h=handoversOf(z.id)[0]; return h && now()-h.at<12*3600000 ? `<div class="handover"><span class="tiny muted">آخر تسليم · ${ago(h.at)}</span><div>${esc(h.text)}</div></div>`:''; })()}
    <div class="row small muted"><span>${ic('coffee')} ${s.onBreak.length} استراحة</span><span>· ${s.idle.length} لم يحضر</span><span>· المستهدف ${z.target}</span></div>
    <div><div class="tiny muted" style="margin-bottom:4px">مستوى الزحمة</div><div class="crowd" role="group" aria-label="مستوى الزحمة">${CROWD.map((c,i)=>`<button class="l${i}" aria-pressed="${cr===i}" data-act="crowd" data-z="${esc(z.id)}" data-l="${i}">${c.t}</button>`).join('')}</div></div>
    <div class="row">${s.gap>0?`<button class="btn sm primary grow" data-act="pull" data-z="${esc(z.id)}">${ic('move')} أرسل دعم (${s.gap})</button>`:''}<button class="btn sm grow" data-act="goto-zone" data-z="${esc(z.id)}">عرض الفريق</button></div>
  </div></article>`;
}

/* ---------- التقارير ---------- */
function reportsData(){
  return vols().map(v=>{ const b=breakStats(v.id); const n=idx().notesByV[v.id]||[]; return {v, ms:workedMs(v.id), breaks:b.n, breakMs:b.ms, praise:n.filter(x=>x.kind==='praise').length, warn:n.filter(x=>x.kind==='warn').length, r:rating(v.id)}; });
}
function reportsView(){
  const rows=reportsData();
  const sortKey={hours:r=>-r.ms, rating:r=>-(r.r||0), name:r=>r.v.name, breaks:r=>-r.breaks}[UI.sort]||(r=>-r.ms);
  rows.sort((a,b)=>{ const x=sortKey(a), y=sortKey(b); return typeof x==='string'?x.localeCompare(y,'ar'):x-y; });
  const total=rows.reduce((s,r)=>s+r.ms,0); const attended=rows.filter(r=>r.v.status!=='idle').length;
  const tb=rows.reduce((s,r)=>s+r.breaks,0);
  const top=rows.filter(r=>r.ms>0).slice().sort((a,b)=>(b.r||0)-(a.r||0)||b.ms-a.ms).slice(0,5);
  const zrows=zones().map(z=>{ const rs=rows.filter(r=>r.v.zone===z.id); return {z, n:rs.length, ms:rs.reduce((s,r)=>s+r.ms,0), att:rs.filter(r=>r.v.status!=='idle').length}; });

function csv(){
  const rows=reportsData(); const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const head=['الاسم','الرقم','الجوال','الدور','الزون','الحالة','ساعات العمل','عدد الاستراحات','دقائق الاستراحة','إشادات','تنبيهات','التقييم','وقت الحضور','وقت الانصراف'];
  const lines=rows.map(r=>[r.v.name,r.v.code,r.v.phone,r.v.role,zName(r.v.zone),STATUS[r.v.status].t,(r.ms/3600000).toFixed(2),r.breaks,Math.round(r.breakMs/60000),r.praise,r.warn,r.r?r.r.toFixed(1):'',r.v.checkInAt?fmtTime(r.v.checkInAt):'',r.v.outAt?fmtTime(r.v.outAt):''].map(q).join(','));
  return '﻿'+[head.map(q).join(','),...lines].join('\n');
}

function kioskView(){

    const val = k.step==='code' ? k.code : k.pin; const len = k.step==='code' ? 4 : 6;
    inner = `${k.step==='code'?openLost().map(x=>`<div class="lost-banner" style="text-align:start"><b>${ic('eye')} ${LOST_T[x.kind]}: ${esc(x.desc)}</b><span class="small">آخر مشاهدة: ${esc(zName(x.zone))} · ${ago(x.at)}. إذا شفته بلّغ المشرف فوراً.</span></div>`).join(''):''}<div><h1>${k.step==='code'?'أدخل رقم المتطوع':'أدخل الرمز السري'}</h1><p class="muted">${k.step==='code'?'الرقم المكوّن من 4 أرقام في بطاقتك':'رقم '+esc(k.code)}</p></div>
      ${k.msg?`<div class="pill crit nodot" style="justify-self:center;padding:6px 14px">${esc(k.msg)}</div>`:''}
      <div class="pinshow">${Array.from({length:Math.max(len,val.length)}).map((_,i)=>`<i class="${i<val.length?'f':''}">${i<val.length?(k.step==='pin'?'•':esc(val[i])):''}</i>`).join('')}</div>
      <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-act="kp" data-k="${n}">${n}</button>`).join('')}<button class="fn" data-act="kp" data-k="back">مسح</button><button data-act="kp" data-k="0">0</button><button class="fn" data-act="kp" data-k="ok" style="background:var(--accent);color:var(--accent-ink)">التالي</button></div>

  } else if(k.step==='act'){
    const v=S.volunteers[k.vid]; if(!v){ UI.kiosk={step:'code',code:'',pin:'',vid:null}; return kioskView(); }

let kTimer=null;
function kioskDone(ok,title,msg,lu){ UI.kiosk={step:'done',ok,title,msg,lu,code:'',pin:'',vid:null}; scheduleRender(); clearTimeout(kTimer); kTimer=setTimeout(()=>{ if(UI.kiosk.step==='done'){ UI.kiosk={step:'code',code:'',pin:''}; scheduleRender(); } }, 6000); }
function kioskKey(k){
  const s=UI.kiosk; const field = s.step==='code' ? 'code' : 'pin'; s.msg=null;
  if(k==='back'){ s[field]=s[field].slice(0,-1); }
  else if(k==='ok'){
    if(s.step==='code'){ const v=findByCode(s.code); if(!v){ s.msg='الرقم غير مسجل'; s.code=''; } else { s.step='pin'; } }
    else { const v=findByCode(s.code); if(v && secretOf(v)?.pinHash===pinHash(s.pin, v.code)){ s.vid=v.id; s.step='act'; s.pin=''; } else { s.msg='الرمز غير صحيح'; s.pin=''; } }
  } else if(s[field].length<8){ s[field]+=k; if(s.step==='pin' && s.pin.length===6){ scheduleRender(); setTimeout(()=>kioskKey('ok'),120); return; } }
  scheduleRender();
}
function kioskDo(status){
  const vid=UI.kiosk.vid; const v=S.volunteers[vid]; if(!v) return;
  if(status==='break'){
    const r=requestBreak(vid,'kiosk');
    if(r.reason==='budget') return kioskDone(false,'انتهى رصيد استراحتك اليوم',`رصيد الاستراحة ${allowMin()} دقيقة يومياً. لو تحتاج استراحة راجع المشرف.`);
    if(r.queued) return kioskDone(true,`أنت رقم ${r.pos} في طابور الاستراحة`,`${BREAK_WHY[r.reason]}${r.pk?` (${r.pk.title} الساعة ${r.pk.time})`:''}. بنعطيك الدور أول ما يتوفر من يغطي مكانك، تابع من جوالك أو ارجع هنا.`);
    return kioskDone(true,'استراحة موفقة',`باقي لك ${fmtDur(breakLeft(vid))} من رصيد استراحة اليوم. لا تنسَ تسجيل العودة.`);
  }
  const wasBreak=v.status==='break', wasIdle=v.status==='idle'||v.status==='out';
  const firstToday = wasIdle && !(idx().byV[vid]||[]).some(l=>l.type==='in' && l.at>=dayStart());
  setStatus(vid,status,'kiosk');
  const z=zName(v.zone);
  const first=v.name.split(' ')[0];
  const luL=ackLevel(vid); const lu=luL?luL.t:null; if(lu) setTimeout(()=>say(`مبروك يا ${first}! وصلت المستوى ${lu}`), 2500);
  const bud=v.buddy&&S.volunteers[v.buddy]; const budTxt = bud ? ` رفيقك اليوم: ${bud.name} (${STATUS[bud.status].t}).` : '';
  if(status==='active'){
    const left=breakLeft(vid); const h=handoversOf(v.zone)[0]; const hoTxt = !wasBreak && h && now()-h.at<12*3600000 ? ` ملاحظة التسليم: ${h.text}` : '';
    const title = wasBreak?'أهلاً بعودتك':'تم تسجيل حضورك';
    const msg = (wasBreak ? (left>=0?`رجعت في الوقت +${PTS.ontime} نقاط. باقي ${fmtDur(left)} من رصيدك. توجّه إلى: ${z}`:`تجاوزت رصيد الاستراحة بـ ${fmtDur(-left)}. توجّه إلى: ${z}`) : `${firstToday?`+${PTS.checkin} نقاط حضور. `:''}توجّه إلى: ${z}.`) + hoTxt;
    say(wasBreak ? `أهلاً بعودتك يا ${first}` : `أهلاً ${first}، حياك الله. توجّه إلى ${z}`);
    UI.kiosk={step:'energy', vid, title, msg: msg+(wasBreak?'':budTxt), lu, code:'', pin:''}; scheduleRender(); clearTimeout(kTimer); kTimer=setTimeout(()=>{ if(UI.kiosk.step==='energy'){ kioskDone(true, UI.kiosk.title, UI.kiosk.msg, UI.kiosk.lu); } }, 20000); return;
  }
  else if(status==='break'){ say(`استراحة موفقة يا ${first}`); kioskDone(true,'استراحة موفقة',`باقي لك ${fmtDur(breakLeft(vid))} من رصيد استراحة اليوم. لا تنسَ تسجيل العودة.`, lu); }
  else { say(`شكراً لعطائك يا ${first}`); kioskDone(true,'شكراً لعطائك','تم تسجيل انصرافك. نراك قريباً', lu); }
}

لا تتجاوز 170 كلمة إلا إذا طُلب تقرير.`;
function aiSnapshot(){
  const c=cfg();
  return JSON.stringify({
    الفعالية:c.eventName, الوقت_الآن:fmtTime(now()), رصيد_الاستراحة_اليومي_بالدقائق:allowMin(), طوارئ:emActive()?EM_T[c.emergency.type]:'لا', الساعة_الذهبية:goldNow()?`مفعّلة ${goldNow().zone?'في '+zName(goldNow().zone):'للجميع'}`:'لا',

    الذروات:peaks().filter(p=>peakState(p)!=='past').map(p=>({العنوان:p.title, الساعة:p.time, الزون:zName(p.zone), المتوقع:CROWD[p.level??2].t, الحالة:{soon:'قريبة',live:'جارية',later:'لاحقاً'}[peakState(p)]})),
    المتطوعون:vols().slice(0,300).map(v=>{ const o={الاسم:v.name, الزون:zName(v.zone), الدور:v.role, الحالة:STATUS[v.status].t};
      if(v.status==='active') o.يعمل_متواصل_دقائق=Math.round((now()-(v.activeSince||now()))/60000);
      if(v.status==='active'||v.status==='break') o.باقي_رصيد_الاستراحة_دقائق=Math.round(breakLeft(v.id)/60000);
      if(v.breakReq) o.في_طابور_الاستراحة=true; if(v.energy && now()-v.energy.at<4*3600000) o.الطاقة=ENERGY[v.energy.v].t; const g=gami(v.id); o.النقاط=g.p; o.ساعات_العمل=+(g.w/3600000).toFixed(1); const r=rating(v.id); if(r) o.التقييم=+r.toFixed(1);
      const w=(idx().notesByV[v.id]||[]).filter(n=>n.kind==='warn').length; if(w) o.تنبيهات=w; return o; }),
    البلاغات_المفتوحة:Object.values(S.alerts).filter(a=>!a.resolved).map(a=>({النوع:ALERT_T[a.type]?.t, الزون:zName(a.zone), النص:a.text, منذ_دقائق:Math.round((now()-a.at)/60000)})),
    المهام_الفورية:liveMissions().map(m=>({المهمة:m.title, الزون:zName(m.zone), المطلوب:m.need, قبلها:(m.takers||[]).length})),

    الاحتياط_المتاح:reserves().map(v=>v.name),
    ملاحظات_التسليم_الأخيرة:handoversOf().slice(0,6).map(h=>({الزون:zName(h.zone), النص:h.text})),
    تحدي_الزونات:zoneRanking().map(x=>({الفريق:x.z.name, النتيجة:x.val})),
    اقتراحات_النقل_المحسوبة:suggestions().map(m=>({المتطوع:S.volunteers[m.vid]?.name, من:zName(m.from), إلى:zName(m.to)})),
  });
}
function mdLite(t){
  const lines=esc(t).split('\n'); let out='', list=false;
  for(let l of lines){
    l=l.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    const m=l.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)/);
    if(m){ if(!list){ out+='<ul>'; list=true; } out+=`<li>${m[1]}</li>`; continue; }
    if(list){ out+='</ul>'; list=false; }
    if(/^#{1,4}\s/.test(l)) out+=`<h4>${l.replace(/^#+\s/,'')}</h4>`; else if(l.trim()) out+=`<p>${l}</p>`;
  }
  if(list) out+='</ul>'; return out;
}

function renderAI(){
  const el=$('#ai-log'); if(!el) return;
  el.innerHTML = AI.msgs.length ? AI.msgs.map((m,i)=>m.role==='user'?`<div class="ai-msg user">${esc(m.text)}</div>`:`<div class="ai-msg assistant">${m.text?mdLite(m.text):'<span class="muted">يحلل الوضع…</span>'}${m.text&&!AI.busy?`<div class="row" style="margin-top:6px"><button class="btn sm ghost" data-act="ai-copy" data-i="${i}">${ic('copy')} نسخ</button></div>`:''}</div>`).join('')
    : `<p class="small muted" style="margin:0">المساعد يقرأ وضع الفعالية الآن (الزونات، الاستراحات، الذروات، البلاغات، المهام) ويقترح عليك وش تسوي بالأسماء.</p>`;
  el.scrollTop=el.scrollHeight;

async function askAI(q, kind){
  if(!q || AI.busy) return;
  if(!SAMPLE) return toast('المساعد يشتغل في الرابط المنشور فقط','warn');
  const history=AI.msgs.slice(-4).map(m=>(m.role==='user'?'سؤال المشرف: ':'ردك السابق: ')+m.text).join('\n\n');
  AI.msgs.push({role:'user',text:q}); const a={role:'assistant',text:''}; AI.msgs.push(a); AI.busy=true; renderAI();
  const prompt=`${AI_SYS}\n\nبيانات الفعالية الآن:\n${aiSnapshot()}\n\n${history?'المحادثة السابقة:\n'+history+'\n\n':''}طلب المشرف الآن: ${q}`;
  try{ const r=await SAMPLE(prompt,{cache:false, modelTier:kind==='report'?'complex':'default', onText:({text})=>{ a.text=text; renderAI(); }}); a.text=r.text||a.text; }
  catch(e){ a.text = e?.code==='rate_limited' ? 'طلبات كثيرة في وقت قصير، انتظر دقيقة وحاول.' : e?.code==='not_granted' ? 'المساعد غير مفعّل لهذا الحساب.' : (e?.text || 'تعذر الوصول للمساعد. حاول مرة ثانية.'); }
  AI.busy=false; renderAI();
}

/* ---------- الشهادة ---------- */
function drawIcon(ctx, name, cx, cy, size){
  const svg=IC[name]||''; ctx.save(); ctx.translate(cx-size/2, cy-size/2); ctx.scale(size/24,size/24); ctx.lineWidth=2; ctx.lineCap='round'; ctx.lineJoin='round';
  for(const m of svg.matchAll(/<(path|circle|rect)([^>]*)\/>/g)){
    const a=Object.fromEntries([...m[2].matchAll(/(\w+)="([^"]*)"/g)].map(x=>[x[1],x[2]]));
    if(m[1]==='path') ctx.stroke(new Path2D(a.d));
    else if(m[1]==='circle'){ ctx.beginPath(); ctx.arc(+a.cx,+a.cy,+a.r,0,Math.PI*2); ctx.stroke(); }
    else { const p=new Path2D(); if(p.roundRect) p.roundRect(+a.x,+a.y,+a.width,+a.height,+(a.rx||0)); else p.rect(+a.x,+a.y,+a.width,+a.height); ctx.stroke(p); }
  }
  ctx.restore();
}
async function certImage(vid){
  try{ await document.fonts.ready; }catch{}
  const v=S.volunteers[vid]; const g=gami(vid); const c=cfg();
  const W=1600, H=1130; const cv=document.createElement('canvas'); cv.width=W; cv.height=H; const x=cv.getContext('2d');
  const D='"Readex Pro","IBM Plex Sans Arabic",sans-serif', B='"IBM Plex Sans Arabic",sans-serif';
  x.fillStyle='#fbfaf6'; x.fillRect(0,0,W,H);
  const BC=brandCfg().color||'#0d5a70';
  x.strokeStyle=BC; x.lineWidth=14; x.strokeRect(36,36,W-72,H-72);
  x.strokeStyle='#c99a06'; x.lineWidth=3; x.strokeRect(62,62,W-124,H-124);
  [[62,62],[W-62,62],[62,H-62],[W-62,H-62]].forEach(([a,b])=>{ x.fillStyle='#c99a06'; x.beginPath(); x.arc(a,b,12,0,Math.PI*2); x.fill(); });
  x.direction='rtl'; x.textAlign='center'; x.textBaseline='middle';
  if(logoUrl()){ try{ const im=await new Promise((r,j)=>{ const i=new Image(); i.onload=()=>r(i); i.onerror=j; i.src=logoUrl(); }); const lh=90, lw=im.width*lh/im.height; x.drawImage(im, W/2-lw/2, 85, lw, lh); }catch{} }
  x.fillStyle=BC; x.font=`600 30px ${B}`; x.fillText(c.eventName||'', W/2, logoUrl()?200:140);
  x.fillStyle='#122129'; x.font=`700 76px ${D}`; x.fillText('شهادة شكر وتقدير', W/2, 230);
  x.fillStyle='#c99a06'; x.fillRect(W/2-90, 285, 180, 5);
  x.fillStyle='#5a6a73'; x.font=`400 32px ${B}`; x.fillText('تتقدّم إدارة الفعالية بخالص الشكر والتقدير إلى', W/2, 350);
  x.fillStyle=BC; x.font=`700 88px ${D}`; x.fillText(v.name, W/2, 450);
  x.fillStyle='#122129'; x.font=`400 32px ${B}`; x.fillText(`على عطائه وجهوده التطوعية المميزة بدور «${v.role||'متطوع'}»، ونتمنى له دوام التوفيق.`, W/2, 535);
  const stats=[[`${(g.w/3600000).toFixed(1)}`,'ساعة تطوع'],[`${g.p}`,'نقطة'],[g.level.t,'المستوى'],[`${g.badges.length}`,'ملصق إنجاز']];
  const bw=250, gap=30, sx=W/2-(stats.length*bw+(stats.length-1)*gap)/2;
  stats.forEach(([val,lbl],i)=>{ const bx=sx+i*(bw+gap); x.fillStyle='#eef4f5'; x.beginPath(); if(x.roundRect) x.roundRect(bx,590,bw,120,18); else x.rect(bx,590,bw,120); x.fill(); x.fillStyle=i===2?g.level.c:'#0d5a70'; x.font=`700 46px ${D}`; x.fillText(val, bx+bw/2, 635); x.fillStyle='#5a6a73'; x.font=`500 24px ${B}`; x.fillText(lbl, bx+bw/2, 685); });
  const earned=BADGES.filter(b=>g.badges.includes(b.id)).slice(0,8);
  if(earned.length){ const r=40, step=150, ex=W/2+((earned.length-1)*step)/2;
    earned.forEach((b,i)=>{ const cx=ex-i*step, cy=800; x.fillStyle=b.c; x.beginPath(); x.arc(cx,cy,r,0,Math.PI*2); x.fill(); x.strokeStyle='#fff'; drawIcon(x,b.i,cx,cy,38); x.fillStyle='#122129'; x.font=`600 22px ${B}`; x.fillText(b.t,cx,cy+64); }); }
  const code=`VP-${v.code}-${hash(vid+(c.salt||'')).slice(0,5).toUpperCase()}`;
  x.font=`400 24px ${B}`; x.fillStyle='#5a6a73';
  x.textAlign='right'; x.fillText(`التاريخ: ${new Date().toLocaleDateString('ar-u-nu-latn',{day:'numeric',month:'long',year:'numeric'})}`, W-140, 980);
  x.textAlign='left'; x.direction='ltr'; x.fillText(code, 140, 980);
  x.direction='rtl'; x.textAlign='center'; x.fillStyle='#122129'; x.font=`600 28px ${B}`; x.fillText('إدارة الفعالية', W/2, 960); x.strokeStyle='#c4ccd0'; x.lineWidth=2; x.beginPath(); x.moveTo(W/2-140,1000); x.lineTo(W/2+140,1000); x.stroke();
  return cv;
}

/* ============ النوافذ والإشعارات ============ */
function openModal(html){ const m=$('#modal'); m.innerHTML=html; m.classList.add('open'); $('#scrim').classList.add('open'); }
function closeModal(){ $('#modal').classList.remove('open'); $('#modal').innerHTML=''; if(!UI.drawer) $('#scrim').classList.remove('open'); MODAL_AFTER=null; }
function askConfirm(title, text, ok='تأكيد', danger=false){
  return new Promise(res=>{
    openModal(`<div class="modal-h"><h2>${esc(title)}</h2></div><div class="modal-b"><p style="margin:0">${text}</p></div><div class="modal-f"><button class="btn ${danger?'crit':'primary'}" id="cf-ok">${esc(ok)}</button><button class="btn" id="cf-no">إلغاء</button></div>`);
    $('#cf-ok').onclick=()=>{ closeModal(); res(true); }; $('#cf-no').onclick=()=>{ closeModal(); res(false); };
  });
}
function toast(msg, kind=''){ const t=document.createElement('div'); t.className='toast '+kind; t.textContent=msg; $('#toasts').appendChild(t); setTimeout(()=>t.remove(), kind==='ok'&&msg.length>40?6000:3800); }

  'v-alert': el=>{ const t=el.dataset.t; const T=ALERT_T[t]; openModal(`<div class="modal-h"><h2>${T.t}</h2><button class="btn ghost sm" data-act="close-modal">${ic('x')}</button></div><form data-form="v-alert" data-t="${t}"><div class="modal-b"><label class="small muted" for="va-text">تفاصيل (اختياري)</label><textarea class="input" id="va-text" name="text" placeholder="${t==='crowd'?'مثال: تكدس عند المدخل الشرقي':t==='medical'?'مثال: زائر مغمى عليه عند البوابة 3':'مثال: نحتاج شخصين إضافيين للتنظيم'}"></textarea>${micBtn('#va-text')}</div><div class="modal-f"><button class="btn ${T.c==='crit'?'crit':'primary'}">إرسال البلاغ</button><button type="button" class="btn" data-act="close-modal">إلغاء</button></div></form>`); },
};

  'admin-pin': f=>{ const pin=(new FormData(f).get('pin')||'').trim(); if(!/^\d{4,8}$/.test(pin)) return toast('الرمز لازم 4 إلى 8 أرقام','warn'); put('config','main',{...cfg(),adminPinHash:hash(cfg().salt+':admin:'+pin)}); f.reset(); toast('تم تغيير رمز المشرف','ok'); },
  payinfo: f=>{ const vid=getSes()?.id; const fd=new FormData(f); const iban=(fd.get('iban')||'').replace(/\s+/g,'').toUpperCase(); const wallet=(fd.get('wallet')||'').replace(/\D/g,''); const holder=(fd.get('holder')||'').trim();

  peak: f=>{ const fd=new FormData(f); const c=cfg(); put('config','main',{...c,peaks:[...(c.peaks||[]),{id:uid('p'),title:fd.get('title').trim(),time:fd.get('time'),zone:fd.get('zone'),level:+fd.get('level'),lead:+fd.get('lead')||30}]}); closeModal(); toast('تمت إضافة الذروة','ok'); },
  em: f=>{ const fd=new FormData(f); const expected=vols().filter(v=>v.status==='active'||v.status==='break').map(v=>v.id); put('config','main',{...cfg(),emergency:{active:true,id:uid('e'),type:fd.get('type'),msg:fd.get('msg').trim(),point:(fd.get('point')||'').trim(),at:now(),expected}}); closeModal(); UI.emOpen=false; toast('تم تفعيل الطوارئ وإرسال التنبيه للجميع','crit'); },

  'v-alert': f=>{ const vid=getSes()?.id; const v=S.volunteers[vid]; put('alerts',uid('a'),{zone:v?.zone||'',type:f.dataset.t,text:(new FormData(f).get('text')||'').trim(),by:vid,at:now(),resolved:false}); closeModal(); toast('وصل بلاغك للمشرف','ok'); },

  const el=e.target.closest('[data-act]'); if(!el) return;
  const fn=ACT[el.dataset.act]; if(!fn) return;

});

  if(el.dataset.meal){ const k=el.dataset.meal; let val=el.value; if(k==='amount'||k==='minHours') val=Math.max(0,+val||0); const c=cfg(); put('config','main',{...c, meal:{...(c.meal||{}), [k]:val}}); toast('تم الحفظ','ok'); }
  if('geoLink' in el.dataset){ const ll=parseLatLng(el.value); if(!ll) return toast('ما لقيت إحداثيات في الرابط. انسخ الإحداثيات من قوقل ماب (اضغط مطولاً على المكان)','warn'); const c=cfg(); put('config','main',{...c, geo:{...(c.geo||{}), ...ll, radius:c.geo?.radius||300, required:c.geo?.required!==false}}); el.value=''; toast('تم حفظ موقع الفعالية','ok'); }
  if('geoR' in el.dataset){ const r=Math.max(50,Math.min(3000,+el.value||300)); const c=cfg(); put('config','main',{...c, geo:{...(c.geo||{}), radius:r}}); toast('تم الحفظ','ok'); }
  if(el.dataset.change==='buddy'){ setBuddy(el.dataset.id, el.value); toast(el.value?`صار ${S.volunteers[el.value]?.name} رفيقه`:'تم فك الثنائي','ok'); }

/* ============ التشغيل ============ */
function browserCaps(){
  if('speechSynthesis' in window){
    TTS = { speak:(text)=>new Promise((res,rej)=>{ try{ const u=new SpeechSynthesisUtterance(text); u.lang='ar-SA'; const vs=speechSynthesis.getVoices(); const v=vs.find(x=>x.lang==='ar-SA')||vs.find(x=>x.lang&&x.lang.startsWith('ar')); if(v) u.voice=v; u.onend=res; u.onerror=rej; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){ rej(e); } }) };
  }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){ let rec=null; const fin=[], sts=[];
    DICT = { onFinal(f){ fin.push(f); }, onState(f){ sts.push(f); },
      start(){ return new Promise((res,rej)=>{ try{ rec=new SR(); rec.lang='ar-SA'; rec.continuous=true; rec.interimResults=false;
        rec.onresult=e=>{ for(let i=e.resultIndex;i<e.results.length;i++) if(e.results[i].isFinal) fin.forEach(f=>f({text:e.results[i][0].transcript})); };
        rec.onstart=()=>{ sts.forEach(f=>f({state:'listening'})); res(); };
        rec.onend=()=>sts.forEach(f=>f({state:'idle'}));
        rec.onerror=e=>{ if(e.error==='not-allowed') rej({code:'not_granted'}); };
        rec.start(); }catch(e){ rej(e); } }); },
      stop(){ try{ rec&&rec.stop(); }catch{} return Promise.resolve(); } };
    DICT.onFinal(({text})=>{ if(dictTarget && text){ dictTarget.value=(dictTarget.value?dictTarget.value.trim()+' ':'')+text; } });
    DICT.onState(({state})=>{ $$('[data-act="dict"]').forEach(b=>b.classList.toggle('rec', state==='listening')); if(state==='idle') dictTarget=null; });
  }
  DL = { save:({filename,data})=>{ const url=URL.createObjectURL(data instanceof Blob?data:new Blob([data])); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); return Promise.resolve({status:'saved'}); } };
}
let UNSUBS=[];
function stopListeners(){ PAY_SUB=false; UNSUBS.forEach(u=>{ try{ u(); }catch{} }); UNSUBS=[]; COLS.forEach(c=>S[c]={}); invalidate(); }
function mergeSecrets(){ if(!AUTH.admin) return; Object.entries(S.volunteers).forEach(([id,v])=>{ const sec=S.secrets[v.code]; if(sec && v.phone!==sec.phone) S.volunteers[id]={...v, phone:sec.phone||''}; }); }
function startListeners(role){
  const slowT=setTimeout(()=>{ if(!S.ready){ S.slow=true; scheduleRender(); } }, 10000);
  const onErr = e=>{ clearTimeout(slowT); S.ready=true;
    if(e && e.code==='permission-denied' && role==='vol'){ AUTH.volCode=null; toast('انتهت جلستك، سجّل دخولك من جديد','warn'); fbLogout(); }
    else if(e && e.code!=='permission-denied') toast('انقطع الاتصال بالبيانات. أعد فتح الصفحة.','crit');
    scheduleRender(); };
  UNSUBS.push(DB.doc('config/main').onSnapshot(sn=>{ S.config = sn.exists ? sn.data() : null; clearTimeout(slowT); S.ready=true; S.slow=false; invalidate(); scheduleRender(); }, onErr));
  if(role==='guest') return;
  COLS.forEach(c=>{
    if((c==='secrets'||c==='meals'||c==='payinfo'||c==='payouts') && role!=='admin') return;
    let q=DB.collection(c); if(c==='notes' && role!=='admin') q=q.where('kind','in',['praise','award','box']);
    UNSUBS.push(q.onSnapshot(snap=>{ const o={}; snap.docs.forEach(d=>{ o[d.id]=d.data(); }); S[c]=o; if(c==='volunteers'||c==='secrets') mergeSecrets();
      if(c==='volunteers' && role==='vol' && !PAY_SUB){ const me=findByCode(AUTH.volCode); if(me){ PAY_SUB=true;
        ['payinfo','payouts'].forEach(pc=>UNSUBS.push(DB.collection(pc).where('v','==',me.id).onSnapshot(sn=>{ const oo={}; sn.docs.forEach(d=>{ oo[d.id]=d.data(); }); S[pc]=oo; invalidate(); scheduleRender(); }, onErr))); } }
      invalidate(); scheduleRender(); }, onErr));
  });
}
let PAY_SUB=false;
async function fbVolLogin(code, pin){
  code=String(code||'').trim(); pin=String(pin||'').trim();
  if(!S.config) { toast('الفعالية لم تُجهز بعد','warn'); return false; }
  const auth=firebase.auth();
  try{
    if(!auth.currentUser || !auth.currentUser.isAnonymous){ await auth.signOut().catch(()=>{}); await auth.signInAnonymously(); }
    const ref=DB.collection('sessions').doc(auth.currentUser.uid);
    await ref.delete().catch(()=>{});
    await ref.set({code, pinHash:pinHash(pin, code), at:now()});
  }catch(e){ toast('الرقم أو الرمز غير صحيح','crit'); return false; }
  AUTH.volCode=code; stopListeners(); startListeners('vol'); scheduleRender(); return true;
}
async function fbLogout(){
  const auth=firebase.auth(); const u=auth.currentUser;
  try{ if(u && AUTH.volCode) await DB.collection('sessions').doc(u.uid).delete(); }catch{}
  AUTH.volCode=null; try{ await auth.signOut(); }catch{}
}
async function boot(){
  render();
  browserCaps();
  if(!FB_ON){ S.mode='local'; loadLocal(); S.ready=true; render(); return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  DB=firebase.firestore();
  try{ DB.settings({ignoreUndefinedProperties:true, experimentalAutoDetectLongPolling:true, merge:true}); }catch{}
  try{ await DB.enablePersistence({synchronizeTabs:true}); }catch{}
  S.mode='db';
  firebase.auth().onAuthStateChanged(async user=>{
    stopListeners(); S.ready=false;
    AUTH.user=user; AUTH.volCode=null;
    AUTH.admin=!!(user && user.email && ADMIN_EMAILS.map(e=>e.toLowerCase()).includes(user.email.toLowerCase()));
    if(!user){ try{ await firebase.auth().signInAnonymously(); }catch(e){ S.ready=true; S.slow=true; scheduleRender(); } return; }
    if(AUTH.admin){ startListeners('admin'); scheduleRender(); return; }
    if(user.email){ await firebase.auth().signOut(); return; }
    try{ const sn=await DB.collection('sessions').doc(user.uid).get(); if(sn.exists){ AUTH.volCode=sn.data().code; startListeners('vol'); scheduleRender(); return; } }catch{}
    startListeners('guest'); scheduleRender();
  });
}
boot();

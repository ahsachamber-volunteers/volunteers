<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة إدارة المتطوعين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* لوحة تشغيل الفعاليات: خلفية رمادية مائلة للأزرق البترولي، بطاقات بيضاء، لون أساسي بترولي، ألوان حالة مستقلة (حاضر/استراحة/حرج) */
:root{
  --bg:#edf1f2;
  --surface:#ffffff;
  --surface-2:#f5f8f9;
  --ink:#24130f;
  --muted:#5a6a73;
  --line:#d8e1e4;
  --accent:#5A1712;
  --accent-ink:#ffffff;
  --accent-soft:#f3e3dd;
  --cu:#B4683C;
  --ok:#15803d; --ok-soft:#dcf5e4;
  --warn:#b45309; --warn-soft:#fdf0d5;
  --crit:#b91c1c; --crit-soft:#fde3e3;
  --info:#2f5fb3; --info-soft:#e2ebfa;
  --idle:#64748b; --idle-soft:#e7ecef;
  --praise:#7c3aed; --praise-soft:#efe8fd;
  --font-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --font-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --r:12px;
  --shadow:0 1px 2px rgba(18,33,41,.05),0 6px 18px rgba(18,33,41,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#140c0b; --surface:#1d1412; --surface-2:#251916; --ink:#f3e9e4; --muted:#b3a39c; --line:#3a2723;
    --accent:#d9a072; --accent-ink:#1d0b07; --accent-soft:#3a1f19;
    --ok:#4ade80; --ok-soft:#123222; --warn:#fbbf24; --warn-soft:#3a2b0c; --crit:#f87171; --crit-soft:#3d1717;
    --info:#7aa7f0; --info-soft:#18284a; --idle:#94a3b8; --idle-soft:#1f2d33; --praise:#b79cf7; --praise-soft:#2a1f45;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#140c0b; --surface:#1d1412; --surface-2:#251916; --ink:#f3e9e4; --muted:#b3a39c; --line:#3a2723;
  --accent:#d9a072; --accent-ink:#1d0b07; --accent-soft:#3a1f19;
  --ok:#4ade80; --ok-soft:#123222; --warn:#fbbf24; --warn-soft:#3a2b0c; --crit:#f87171; --crit-soft:#3d1717;
  --info:#7aa7f0; --info-soft:#18284a; --idle:#94a3b8; --idle-soft:#1f2d33; --praise:#b79cf7; --praise-soft:#2a1f45;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;line-height:1.3;text-wrap:balance;font-weight:600}
h1{font-size:1.25rem}h2{font-size:1.1rem}h3{font-size:1rem}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;font-family:var(--font-display)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.tiny{font-size:.76rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:.9rem;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.warn{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.crit{background:var(--crit);border-color:var(--crit);color:#fff}
:root[data-theme="dark"] .btn.ok,:root[data-theme="dark"] .btn.warn,:root[data-theme="dark"] .btn.crit{color:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.ok,:root:not([data-theme="light"]) .btn.warn,:root:not([data-theme="light"]) .btn.crit{color:#111}}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:5px 10px;font-size:.8rem;border-radius:8px}
.btn.lg{padding:14px 20px;font-size:1.05rem;border-radius:14px}
.btn.block{width:100%}
.icon{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.nodot::before{display:none}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.idle{background:var(--idle-soft);color:var(--idle)}
.pill.praise{background:var(--praise-soft);color:var(--praise)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}

/* inputs */
.field{display:grid;gap:4px}
.field label{font-size:.82rem;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;min-height:40px}
textarea.input{min-height:80px;resize:vertical}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:7px;cursor:pointer;font-size:.82rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-b{padding:14px 16px}
.stack{display:grid;gap:16px}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:6px 0 2px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* shell */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100%}
.side{background:var(--surface);border-inline-start:0;border-inline-end:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand b{font-family:var(--font-display);font-size:1rem;display:block}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:600;cursor:pointer;border:0;background:transparent;width:100%;text-align:start}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav-item .badge{margin-inline-start:auto}
.badge{background:var(--crit);color:#fff;border-radius:999px;font-size:.7rem;padding:1px 7px;font-weight:700}
.side-foot{margin-top:auto;display:grid;gap:8px;padding:8px}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.top .sub{font-size:.8rem;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--ok);font-weight:600}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.view{padding:20px 22px 110px;display:grid;gap:18px;max-width:1400px;width:100%}
.banner{margin:14px 22px 0;padding:10px 14px;border-radius:10px;font-size:.86rem;display:flex;gap:10px;align-items:center}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.info{background:var(--info-soft);color:var(--info)}
.bottom{display:none}
.m-only{display:none!important}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .top{padding:12px 16px}
  .view{padding:16px 16px 110px}
  .banner{margin:12px 16px 0}
  .m-only{display:inline-flex!important}
  .bottom{display:grid;grid-template-columns:repeat(7,1fr);position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);z-index:30;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bottom button{border:0;background:transparent;display:grid;justify-items:center;gap:2px;font-size:.66rem;font-weight:600;color:var(--muted);padding:6px 0;cursor:pointer;position:relative}
  .bottom button[aria-current="page"]{color:var(--accent)}
  .bottom .badge{position:absolute;top:0;inset-inline-end:18%}
}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--k,var(--accent))}
.kpi .v{font-family:var(--font-display);font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .l{font-size:.8rem;color:var(--muted);font-weight:600}

/* zones */
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.zone{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.zone-top{height:5px;background:var(--zc)}
.zone-in{padding:14px;display:grid;gap:12px}
.zone-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.zone-head h3{display:flex;align-items:center;gap:8px}
.zdot{width:10px;height:10px;border-radius:3px;background:var(--zc);flex:none}
.staff{display:flex;align-items:baseline;gap:6px}
.staff .big{font-family:var(--font-display);font-size:2rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:99px}
.bar.warn>i{background:var(--warn)}.bar.crit>i{background:var(--crit)}
.crowd{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.crowd button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:5px 0;font-size:.74rem;font-weight:600;cursor:pointer;color:var(--muted)}
.crowd button[aria-pressed="true"].l0{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.crowd button[aria-pressed="true"].l1{background:var(--info-soft);color:var(--info);border-color:var(--info)}
.crowd button[aria-pressed="true"].l2{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.crowd button[aria-pressed="true"].l3{background:var(--crit-soft);color:var(--crit);border-color:var(--crit)}
.zone.hot{border-color:var(--crit);box-shadow:0 0 0 2px var(--crit-soft),var(--shadow)}

/* lists */
.list{display:grid}
.li{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:11px 16px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li.click{cursor:pointer}
.li.click:hover{background:var(--surface-2)}
.av{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-family:var(--font-display);color:#fff;background:var(--zc,var(--idle));flex:none;font-size:.9rem}
.li .t{font-weight:600}
.li .grow{min-width:min(190px,100%)}
.li .s{font-size:.8rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.people-row{display:grid;grid-template-columns:minmax(180px,2fr) 1.2fr 1.3fr .8fr .8fr auto;align-items:center;gap:12px}
@media (max-width:760px){.people-row{grid-template-columns:1fr auto}.people-row .hide-m{display:none}}
.stars{color:#e0a100;letter-spacing:1px;font-size:.85rem}
.stars .off{color:var(--line)}

/* board */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;align-items:start}
.col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.col-h{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:4px solid var(--zc)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px;min-height:56px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:5px 9px;font-size:.82rem;font-weight:600;cursor:pointer;user-select:none}
.chip .d{width:8px;height:8px;border-radius:50%;background:var(--idle)}
.chip.st-active .d{background:var(--ok)}.chip.st-break .d{background:var(--warn)}.chip.st-out{opacity:.55}
.chip.overdue{border-color:var(--crit);color:var(--crit)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip[aria-pressed="true"] .d{box-shadow:0 0 0 2px var(--accent-ink)}
.chip.lead::after{content:"★";font-size:.7rem;color:#e0a100}
.actionbar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 24px);justify-content:center}
.actionbar .btn{border-color:transparent}
.actionbar .btn:not(.primary):not(.ok):not(.warn):not(.ghost){color:var(--ink)}
.actionbar select{background:var(--surface);color:var(--ink);border-radius:8px;border:0;padding:6px 8px}
@media (max-width:900px){.actionbar{bottom:78px}}

/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(8,18,22,.45);z-index:60;display:none}
.scrim.open{display:block}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(480px,100%);background:var(--bg);z-index:70;transform:translateX(-105%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.2)}
[dir="rtl"] .drawer{inset-inline-end:auto;left:0}
.drawer.open{transform:none}
.drawer-h{padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.drawer-b{overflow:auto;padding:16px;display:grid;gap:14px;align-content:start;flex:1}
.modal{position:fixed;z-index:80;top:50%;left:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 24px));max-height:calc(100% - 40px);overflow:auto;background:var(--surface);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:none}
.modal.open{display:block}
.modal-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.modal-b{padding:16px 18px;display:grid;gap:12px}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-start;flex-wrap:wrap}
.toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:100;display:grid;gap:8px;width:min(420px,calc(100% - 24px))}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:.88rem;box-shadow:0 8px 24px rgba(0,0,0,.25);border-inline-start:4px solid var(--accent)}
.toast.ok{border-color:var(--ok)}.toast.crit{border-color:var(--crit)}.toast.warn{border-color:var(--warn)}

/* stats in drawer */
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.mini>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.mini b{display:block;font-family:var(--font-display);font-size:1.15rem;font-variant-numeric:tabular-nums}
.mini span{font-size:.74rem;color:var(--muted);font-weight:600}
.timeline{display:grid;gap:0}
.tl{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:.85rem}
.tl:last-child{border-bottom:0}
.tl .when{color:var(--muted);font-variant-numeric:tabular-nums;min-width:52px}
.note{border:1px solid var(--line);border-inline-start:4px solid var(--info);background:var(--surface);border-radius:10px;padding:9px 12px;display:grid;gap:4px}
.note.praise{border-inline-start-color:var(--praise)}.note.award{border-inline-start-color:var(--ok)}
.stks{display:flex;flex-wrap:wrap;gap:12px}
.stk{display:grid;justify-items:center;gap:4px;width:72px;text-align:center}
.stk-c{border-radius:50%;display:grid;place-items:center;color:#fff;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.35),transparent 55%),var(--sc);box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--sc),0 4px 10px rgba(0,0,0,.15);transform:rotate(-6deg)}
.stk.off .stk-c{background:var(--surface-2);color:var(--muted);box-shadow:0 0 0 2px var(--line);transform:none;border:2px dashed var(--line)}
.em-panel{margin:14px 22px 0;background:var(--crit);color:#fff;border-radius:14px;padding:14px 16px;display:grid;gap:12px;box-shadow:0 8px 24px rgba(185,28,28,.3)}
:root[data-theme="dark"] .em-panel{color:#1a0505}
.em-panel .btn{background:rgba(255,255,255,.95);color:var(--crit);border-color:transparent}
.em-counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.em-counts>div{background:rgba(255,255,255,.16);border-radius:10px;padding:8px 10px;font-size:.8rem;font-weight:600}
.em-counts b{display:block;font-family:var(--font-display);font-size:1.6rem;line-height:1.1}
.em-roll{background:var(--surface);color:var(--ink);border-radius:10px;padding:10px;display:grid;gap:10px}
.chip.safe{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.chip.help{background:var(--crit-soft);color:var(--crit);border-color:var(--crit)}
.em-screen{position:fixed;inset:0;z-index:95;background:#7f1d1d;color:#fff;display:grid;place-items:center;padding:24px 18px;overflow:auto}
.em-in{width:min(460px,100%);display:grid;gap:16px;text-align:center}
.em-in .icon{width:64px;height:64px;justify-self:center;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
.em-type{font-family:var(--font-display);font-size:1.6rem;font-weight:700}
.em-msg{font-size:1.1rem;line-height:1.7;margin:0}
.em-point{background:rgba(255,255,255,.14);border-radius:14px;padding:14px;display:grid;gap:4px}
.em-point b{font-family:var(--font-display);font-size:1.4rem}
.em-in .btn.lg{padding:18px;font-size:1.15rem;border:0}
.em-safe{background:#22c55e!important;color:#052e12!important}
.em-help{background:#fff!important;color:#7f1d1d!important}
.mission{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;background:var(--surface)}
.mission.urgent{border-color:var(--crit);box-shadow:0 0 0 2px var(--crit-soft)}
.mission.mine{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.ai-log{max-height:52vh;overflow:auto;display:grid;gap:10px;padding:2px}
.ai-msg{border-radius:12px;padding:10px 12px;font-size:.92rem;line-height:1.7}
.ai-msg.user{background:var(--accent-soft);color:var(--accent);justify-self:start;font-weight:600;max-width:85%}
.ai-msg.assistant{background:var(--surface-2);border:1px solid var(--line)}
.ai-msg p{margin:0 0 6px}.ai-msg ul{margin:4px 0 8px;padding-inline-start:20px}.ai-msg h4{margin:8px 0 4px;font-size:.95rem}
.ai-quick{display:flex;gap:6px;flex-wrap:wrap}
.peak{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line)}
.peak:last-child{border-bottom:0}
.peak .when{min-width:58px;text-align:center;font-family:var(--font-display);font-weight:700;font-variant-numeric:tabular-nums}
.btn.rec{background:var(--crit);color:#fff;border-color:var(--crit);animation:pulse 1.2s ease-in-out infinite}
.lost-banner{background:#5b21b6;color:#fff;border-radius:14px;padding:14px;display:grid;gap:8px}
.lost-banner .btn{background:#fff;color:#5b21b6;border:0}
.energy{display:inline-flex;gap:2px;align-items:center;vertical-align:middle}
.energy i{width:7px;height:12px;border-radius:2px;background:var(--line)}
.energy.l1 i:nth-child(-n+1){background:var(--crit)}.energy.l2 i:nth-child(-n+2){background:var(--warn)}.energy.l3 i{background:var(--ok)}
.epick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.epick .btn{flex-direction:column;padding:16px 6px;gap:8px;white-space:normal}
.handover{border-inline-start:3px solid var(--accent);padding:6px 10px;background:var(--surface-2);border-radius:8px;font-size:.88rem}
.cert-img{width:100%;border-radius:10px;border:1px solid var(--line);display:block}
/* شاشة العمليات */
.wall{--bg:#120a09;--surface:#1c1210;--surface-2:#241815;--ink:#f6ece6;--muted:#b8a49b;--line:#3b2622;--accent:#d9a072;--accent-soft:#3a2219;--ok:#4ade80;--ok-soft:#123222;--warn:#fbbf24;--warn-soft:#3a2b0c;--crit:#f87171;--crit-soft:#3d1717;--info:#7aa7f0;--info-soft:#18284a;--idle:#94a3b8;--idle-soft:#1f2d33;
  color-scheme:dark;background:var(--bg);color:var(--ink);min-height:100%;padding:18px 22px;display:grid;gap:16px;align-content:start}
.wall-top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.wall-top h1{font-size:clamp(1.4rem,2.6vw,2.4rem)}
.wall-clock{font-family:var(--font-display);font-size:clamp(1.8rem,3.4vw,3.2rem);font-weight:700;font-variant-numeric:tabular-nums;direction:ltr}
.wall-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.wall-kpis .kpi .v{font-size:clamp(2rem,3.4vw,3rem)}
.wall-main{display:grid;grid-template-columns:2.2fr 1fr;gap:16px;align-items:start}
@media (max-width:1000px){.wall-main{grid-template-columns:1fr}}
.wall-zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.wz{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--zc);border-radius:14px;padding:14px;display:grid;gap:8px}
.wz.hot{border-color:var(--crit);box-shadow:0 0 0 2px var(--crit);animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 5px rgba(248,113,113,.35)}}
.wz .big{font-family:var(--font-display);font-size:2.6rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.wall-side{display:grid;gap:12px}
.wall-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:8px}
.wall-box h3{font-size:1rem;color:var(--muted)}
.gold-banner{background:linear-gradient(90deg,#92400e,#d97706,#facc15,#d97706,#92400e);background-size:300% 100%;animation:shine 4s linear infinite;color:#1c0f02;border-radius:12px;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:600;box-shadow:0 6px 18px rgba(217,119,6,.35)}
@keyframes shine{to{background-position:300% 0}}
.gold-banner .icon{width:20px;height:20px}
.view,.portal,.kpanel,.wall{grid-template-columns:minmax(0,1fr)}
.view>*,.portal>*,.kpanel>*,.wall>*{min-width:0}
.ticker{max-width:100%;overflow:hidden;background:var(--ink);color:var(--bg);border-radius:10px;white-space:nowrap}
.ticker-in{display:inline-flex;gap:42px;padding:8px 0;animation:tick 45s linear infinite;will-change:transform}
.tk-item{display:inline-flex;gap:6px;align-items:center;font-size:.85rem;font-weight:600}
.tk-item .icon{width:15px;height:15px;color:#facc15}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(50%)}}
@media (prefers-reduced-motion:reduce){.ticker{white-space:normal}.ticker-in{animation:none;flex-wrap:wrap;padding:8px 12px}.ticker-in>.tk-item:nth-child(n+4){display:none}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:130}
#glory{position:fixed;inset:0;z-index:110;display:none;place-items:center;background:rgba(5,12,15,.72);padding:20px;cursor:pointer}
#glory.open{display:grid}
.glory-in{width:min(720px,100%);background:linear-gradient(160deg,#1a1205,#3b2706);border:3px solid #facc15;border-radius:24px;padding:34px 24px;text-align:center;color:#fff7e0;display:grid;gap:10px;justify-items:center;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.glory-tag{background:#facc15;color:#1c0f02;border-radius:999px;padding:4px 16px;font-weight:700;font-size:.9rem}
.glory-ic{width:64px!important;height:64px!important;color:#facc15}
.glory-name{font-family:var(--font-display);font-size:clamp(2rem,6vw,3.6rem);font-weight:700;line-height:1.2}
.glory-t{font-size:clamp(1rem,2.4vw,1.4rem);opacity:.9}
.lvlup{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:rgba(5,12,15,.7);padding:20px}
.lvlup-in{width:min(420px,100%);border-radius:24px;padding:28px 20px;text-align:center;display:grid;gap:12px;justify-items:center;background:var(--surface);border:3px solid var(--lc);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.lvlup-badge{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;color:#fff;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.5),transparent 55%),var(--lc);box-shadow:0 0 0 6px var(--surface),0 0 0 10px var(--lc),0 0 40px var(--lc)}
.lvlup-badge .icon{width:54px;height:54px}
.mbox{width:120px;height:120px;margin:0 auto;border-radius:24px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#7c3aed,#db2777);box-shadow:0 12px 30px rgba(124,58,237,.4)}
.mbox .mbox-ic{width:60px;height:60px}
.mbox.shake{animation:shake .25s ease-in-out infinite}
@keyframes shake{25%{transform:rotate(-8deg) scale(1.05)}75%{transform:rotate(8deg) scale(1.05)}}
.mbox.open{animation:pop .5s cubic-bezier(.2,1.4,.4,1);background:linear-gradient(145deg,#0d9488,#0e7490)}
.mbox.open.rare{background:linear-gradient(145deg,#ca8a04,#facc15);color:#1c0f02;box-shadow:0 0 50px rgba(250,204,21,.7)}
.box-card{background:linear-gradient(135deg,#7c3aed,#db2777);color:#fff;border-radius:16px;padding:16px;display:flex;gap:14px;align-items:center}
.box-card .mini-box{width:58px;height:58px;border-radius:14px;background:rgba(255,255,255,.2);display:grid;place-items:center;animation:shake .6s ease-in-out infinite;flex:none}
.box-card .btn{background:#fff;color:#7c3aed;border:0}
.flame{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.flame .icon{color:#ea580c}
.flame.f0 .icon{color:var(--line)}.flame.f2 .icon{width:24px;height:24px}.flame.f3 .icon{width:30px;height:30px;filter:drop-shadow(0 0 6px #fb923c)}
.stk.legend .stk-c{background:conic-gradient(from 0deg,#facc15,#fde68a,var(--sc),#facc15);color:#1c0f02;box-shadow:0 0 0 3px var(--surface),0 0 0 5px #facc15,0 0 18px #facc15;animation:spinglow 6s linear infinite}
@keyframes spinglow{50%{filter:brightness(1.2)}}
.legend-row{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.buddy{display:flex;gap:10px;align-items:center}
.voucher{position:relative;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,#065f46,#0d9488);color:#ecfdf5;padding:18px;display:grid;gap:10px;box-shadow:0 10px 26px rgba(13,148,136,.35)}
.voucher::before,.voucher::after{content:"";position:absolute;top:50%;width:26px;height:26px;border-radius:50%;background:var(--bg);transform:translateY(-50%)}
.voucher::before{left:-13px}.voucher::after{right:-13px}
.voucher .amt{font-family:var(--font-display);font-size:2.6rem;font-weight:700;line-height:1}
.voucher .cut{border-top:2px dashed rgba(255,255,255,.35);margin:2px 6px}
.voucher .btn{background:#fff;color:#065f46;border:0}
.voucher.used{background:linear-gradient(135deg,#475569,#64748b);box-shadow:none}
.voucher.wait{background:linear-gradient(135deg,#334155,#0f766e)}
.stamp-ok{display:grid;justify-items:center;gap:8px;text-align:center;padding:10px 0}
.stamp-ok .big{width:120px;height:120px;border-radius:50%;background:#16a34a;color:#fff;display:grid;place-items:center;box-shadow:0 0 0 8px #dcfce7;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
.stamp-ok .big .icon{width:64px;height:64px;stroke-width:3}
.brand-mark img,.logo-img{width:100%;height:100%;object-fit:contain;border-radius:inherit;display:block}
.brand-mark.has-logo{background:#fff;padding:3px}
.on-accent{background:var(--accent)!important}
.logo-sm{width:36px;height:36px;border-radius:10px;background:#fff;padding:3px;flex:none;display:inline-block;vertical-align:middle}
.hero-logo{width:96px;height:96px;border-radius:22px;background:#fff;padding:8px;box-shadow:var(--shadow)}
.wall-logo{width:64px;height:64px;border-radius:16px;background:#fff;padding:6px}
.brand-prev{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center;background:var(--surface-2)}
.sw.big{width:34px;height:34px;border-radius:10px}
.podium{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.award-card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;background:var(--surface)}.note.warn{border-inline-start-color:var(--crit)}

/* tables */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
th{font-size:.76rem;color:var(--muted);font-weight:700;background:var(--surface-2);cursor:pointer}
td.n{font-variant-numeric:tabular-nums}

/* landing */
.center{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.landing{width:min(980px,100%);display:grid;gap:22px}
.hero{display:grid;gap:8px}
.hero h1{font-size:clamp(1.5rem,4vw,2.2rem);font-weight:700}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.door{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:10px;cursor:pointer;text-align:start;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.door:hover{border-color:var(--accent);transform:translateY(-2px)}
.door .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.door h2{font-size:1.1rem}
.feature-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 18px;font-size:.88rem;color:var(--muted);padding:0;margin:0;list-style:none}
.feature-list li{display:flex;gap:8px;align-items:flex-start}
.feature-list li::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--accent);margin-top:9px;flex:none}

/* kiosk & portal */
.kiosk{min-height:100%;display:grid;grid-template-rows:auto 1fr;background:var(--bg)}
.kiosk-top{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--line);gap:10px}
.kiosk-body{display:grid;place-items:center;padding:20px}
.kpanel{width:min(440px,100%);display:grid;gap:16px;text-align:center}
.pinshow{display:flex;justify-content:center;gap:10px;direction:ltr}
.pinshow i{width:46px;height:56px;border-radius:12px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-style:normal;font-family:var(--font-display);font-size:1.6rem;font-weight:700}
.pinshow i.f{border-color:var(--accent)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;direction:ltr}
.keypad button{height:62px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-family:var(--font-display);font-size:1.5rem;font-weight:600;cursor:pointer;box-shadow:var(--shadow)}
.keypad button:active{background:var(--accent-soft)}
.keypad .fn{font-size:.95rem;font-family:var(--font-body);color:var(--muted)}
.bigact{display:grid;gap:10px}
.bigact .btn{padding:18px;font-size:1.15rem;border-radius:14px}
.portal{width:min(560px,100%);margin:0 auto;padding:16px 16px 40px;display:grid;gap:14px}
.vhero{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:18px;display:grid;gap:12px}
.vhero .zname{font-family:var(--font-display);font-size:1.6rem;font-weight:700;line-height:1.2}
.vhero .lbl{opacity:.8;font-size:.82rem;font-weight:600}
.vhero .pill{background:rgba(255,255,255,.18);color:inherit}
.timer{font-family:var(--font-display);font-size:2.4rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.alert-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.alert-row .btn{flex-direction:column;padding:12px 6px;font-size:.82rem;white-space:normal}
.loader{display:grid;place-items:center;gap:12px;min-height:100%;color:var(--muted)}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.cred{display:grid;grid-template-columns:1fr auto auto;gap:8px 14px;align-items:center;font-size:.9rem}
.cred b.num{font-size:1rem}
.hr{height:1px;background:var(--line);margin:4px 0}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:7px;border:2px solid transparent;cursor:pointer}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.zone-edit{display:grid;grid-template-columns:1fr 90px auto;gap:8px;align-items:end;padding:12px 0;border-bottom:1px solid var(--line)}
@media (max-width:560px){.zone-edit{grid-template-columns:1fr 80px}.zone-edit .swatches{grid-column:1/-1}}
/* ===== إضافات النسخة 3 ===== */
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.banner.ok .btn{margin-inline-start:auto}
.av.ph{padding:0;overflow:hidden;background:var(--surface-2)}
.av.ph img{width:100%;height:100%;object-fit:cover;display:block}
.av.kav{width:72px;height:72px;font-size:1.5rem;justify-self:center;border-radius:20px}
.hheart{font-size:.8rem;margin-inline-start:2px}
/* البدل */
.bal{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.bal b{font-family:var(--font-display);font-size:2.4rem;line-height:1;color:var(--ok)}
.pdays{display:flex;flex-wrap:wrap;gap:6px}
.pday{display:inline-flex;flex-direction:column;align-items:center;min-width:46px;padding:4px 6px;border-radius:9px;font-size:.78rem;border:1px solid var(--line);background:var(--surface-2)}
.pday b{font-size:.7rem;font-weight:500;color:var(--muted)}
.pday.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok);font-weight:700}
.pday.no{color:var(--muted)}
.pday.now{border-style:dashed}
.seq-card{display:grid;gap:8px;justify-items:center;text-align:center;padding:22px 14px;border:1px solid var(--line);border-radius:16px;background:var(--surface-2)}
.seq-name{font-family:var(--font-display);font-size:1.4rem;font-weight:700}
.seq-amt{font-family:var(--font-display);font-size:2.6rem;font-weight:700;color:var(--ok);line-height:1.1}
.seq-amt span{font-size:1rem;color:var(--muted)}
.seq-iban{font-size:1.05rem;letter-spacing:.5px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;max-width:100%;overflow-wrap:anywhere}
.pay-list summary{list-style:none}
.pay-list summary::-webkit-details-marker{display:none}
/* الاستراحة القصيرة */
.mini-card{border-color:#34d39966;box-shadow:0 0 0 3px #34d39922}
.mini-banner{margin:0;flex-wrap:wrap;font-size:.95rem}
.mini-banner b.num{font-size:1.2rem}
/* نموذج البيانات */
.ph-pick{display:flex;gap:14px;align-items:center}
#ph-prev{width:84px;height:84px;border-radius:22px;overflow:hidden;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-family:var(--font-display);font-weight:700;font-size:1.6rem;flex:none}
#ph-prev img{width:100%;height:100%;object-fit:cover}
.fs{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0;min-width:0}
.fs legend{padding:0 6px;font-weight:700;font-size:.92rem}
.segr{position:relative;cursor:pointer}
.segr input{position:absolute;opacity:0;pointer-events:none}
.segr span{display:inline-block;padding:6px 14px;border-radius:7px;font-size:.86rem;font-weight:600;color:var(--muted)}
.segr input:checked+span{background:var(--accent);color:var(--accent-ink,#fff)}
.segr input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.chk-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 10px;margin:8px 0}
.consent{align-items:flex-start;background:var(--surface-2);padding:10px 12px;border-radius:10px;flex-wrap:nowrap}
.health{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.health.has{border-color:#f8717166;background:color-mix(in srgb,var(--crit-soft) 45%,transparent)}
.health h3{font-size:.98rem}
.hrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.88rem}
.hrow>span:first-child{min-width:92px}
.hrow.em{border-top:1px dashed var(--line);padding-top:8px;margin-top:2px}
.hrow.em .btn{margin-inline-start:auto}
/* بيانات الدخول */
.cred.cred3{grid-template-columns:1fr auto auto auto}
/* صفحة الزائر */
.thx{min-height:100vh;padding:20px;background:radial-gradient(circle at 50% 0,var(--accent-soft),var(--bg) 60%)}
.thx-card{width:min(440px,100%);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px 20px;box-shadow:var(--shadow);display:grid;gap:12px;justify-items:center;text-align:center}
.thx-card h1{font-size:1.6rem}
.thx-card .input,.thx-card .btn{width:100%}
.thx-card .logo-sm{width:56px;height:56px}
.thx-heart{font-size:3.4rem;animation:beat 1.2s ease-in-out infinite}
.thx-stars{display:flex;flex-direction:row-reverse;gap:4px;justify-content:center}
.thx-stars input{position:absolute;opacity:0}
.thx-stars span{font-size:2.6rem;color:var(--line);cursor:pointer;transition:transform .15s,color .15s;display:inline-block}
.thx-stars label:hover span,.thx-stars label:hover~label span,.thx-stars label:has(input:checked) span,.thx-stars label:has(input:checked)~label span{color:#f59e0b}
.thx-stars label:has(input:checked) span{transform:scale(1.15)}
.thx-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.thx-chips input{position:absolute;opacity:0}
.thx-chips span{display:inline-block;padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:.85rem;cursor:pointer}
.thx-chips input:checked+span{background:var(--accent);color:var(--accent-ink,#fff);border-color:transparent}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.1)}}
.thx-new{border-color:#34d399;box-shadow:0 0 0 3px #34d39933}
.thx-item{font-size:.9rem;padding:8px 10px;background:var(--surface-2);border-radius:10px}
/* الماسح */
.scanbox{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:1;max-width:340px;width:100%;margin:auto}
.scanbox video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.scanbox i{position:absolute;inset:18%;border:3px solid #fff;border-radius:18px;box-shadow:0 0 0 999px #0006}
/* بطاقة المتطوع: تصميم الأمسية (مقاسات بالـem: 21.25em × 33.8em = 54×86 ملم) */

    const ref = col==='config' ? DB.doc('config/main') : DB.collection(col).doc(id); return queued(col+'/'+id, ()=>ref.set(d)).catch(onWriteErr); }

}

function zoneStats(){

    const inZ = all.filter(v=>v.zone===z.id);
    const active = inZ.filter(v=>v.status==='active');
    const onBreak = inZ.filter(v=>v.status==='break');
    const idle = inZ.filter(v=>v.status==='idle');
    const need = Math.max(0, Math.ceil((z.target||0) * CROWD[z.crowd??1].m));
    return {z, all:inZ, active, onBreak, idle, need, gap: need - active.length};

}

    v.activeSince=t; delete v.breakAt;

  } else if(status==='idle'){ delete v.breakAt; }

function qrMatrix(text){ const q=qrcode(0,'M'); q.addData(text); q.make(); const n=q.getModuleCount(); const m=[]; for(let r=0;r<n;r++){ m.push([]); for(let c=0;c<n;c++) m[r].push(q.isDark(r,c)); } return m; }
function qrSvg(text, cls='qr'){ const m=qrMatrix(text); const n=m.length, pad=2; let d=''; m.forEach((row,r)=>row.forEach((on,c)=>{ if(on) d+=`M${c+pad} ${r+pad}h1v1h-1z`; })); return `<svg class="${cls}" viewBox="0 0 ${n+pad*2} ${n+pad*2}" shape-rendering="crispEdges" aria-hidden="true"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#111"/></svg>`; }
function qrDraw(x, text, X, Y, size){ const m=qrMatrix(text); const n=m.length+4; const cs=size/n; x.fillStyle='#fff'; x.fillRect(X,Y,size,size); x.fillStyle='#111'; m.forEach((row,r)=>row.forEach((on,c)=>{ if(on) x.fillRect(X+(c+2)*cs, Y+(r+2)*cs, Math.ceil(cs), Math.ceil(cs)); })); }
const firstName = n => String(n||'').trim().split(/\s+/)[0]||'';
const thanksUrl = v => `${appUrl()}?t=${encodeURIComponent(v.code)}&n=${encodeURIComponent(firstName(v.name))}`;

/* ---------- شكراً يا بطل: صفحة الزائر ---------- */
const URLQ = new URLSearchParams(location.search);
const THX = URLQ.get('t') ? {code:String(URLQ.get('t')).slice(0,8), n:String(URLQ.get('n')||'').slice(0,30)} : null;
const THX_CHIPS = ['ساعدني بسرعة','تعامل راقي','ابتسامة حلوة','وجّهني صح','شكراً من القلب'];
function thanksPage(){
  const c=cfg()||{}; const key='thx:'+THX.code+':'+dayKey(); const done=lsGet(key);
  const nm=THX.n||'المتطوع';
  if(done || UI.thxDone) return `<div class="center thx"><div class="thx-card">${logoSm()}<div class="thx-heart">💚</div><h1>وصل شكرك لـ ${esc(nm)}!</h1><p class="muted">كلمتك تفرق معه أكثر مما تتخيل. شكراً لزيارتك ${esc(c.eventName||'')}.</p></div></div>`;
  const st=UI.thxStars||0;
  return `<div class="center thx"><form class="thx-card stack" data-form="thanks" data-sticky="thanks">
    ${logoSm()}<div class="tiny muted">${esc(c.eventName||'')}</div>
    <h1>اشكر ${esc(nm)} 💚</h1>
    <p class="muted small" style="margin:0">متطوع ساعدك؟ كلمة منك تصنع يومه.</p>
    <div class="thx-stars" role="radiogroup" aria-label="التقييم">${[5,4,3,2,1].map(i=>`<label aria-label="${i} نجوم"><input type="radio" name="stars" value="${i}" ${st===i?'checked':''}><span>★</span></label>`).join('')}</div>
    <div class="thx-chips">${THX_CHIPS.map(t=>`<label><input type="checkbox" name="chip" value="${t}"><span>${t}</span></label>`).join('')}</div>
    <textarea class="input" name="msg" maxlength="160" placeholder="اكتب له كلمة (اختياري)" style="min-height:70px"></textarea>
    <button class="btn primary lg">إرسال الشكر</button>
    <p class="tiny muted" style="margin:0">بدون تسجيل، وما نطلب أي بيانات منك.</p>
  </form></div>`;
}

/* ---------- ماسح البطاقة في نقطة الحضور ---------- */
let SCAN=null;
async function scanOpen(){
  openModal(`<div class="modal-h"><h2>${ic('qr')} امسح بطاقتك</h2><button class="btn ghost sm" data-act="scan-close" aria-label="إغلاق">${ic('x')}</button></div><div class="modal-b"><div class="scanbox"><video id="scan-v" playsinline muted></video><i></i></div><p class="small muted" style="margin:0;text-align:center" id="scan-msg">قرّب الـQR اللي على بطاقتك من الكاميرا</p></div>`);
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}, audio:false});
    const vd=$('#scan-v'); if(!vd){ stream.getTracks().forEach(t=>t.stop()); return; }
    vd.srcObject=stream; await vd.play();
    let det=null; if('BarcodeDetector' in window){ try{ det=new BarcodeDetector({formats:['qr_code']}); }catch{} }
    if(!det && !window.jsQR){ await new Promise((r,j)=>{ const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'; s.onload=r; s.onerror=j; document.head.appendChild(s); }); }
    const cv=document.createElement('canvas'); const cx=cv.getContext('2d',{willReadFrequently:true});
    SCAN={stream, on:true};
    const tick=async()=>{ if(!SCAN?.on) return; let txt=null;
      try{ if(det){ const r=await det.detect(vd); txt=r[0]?.rawValue||null; } else if(vd.videoWidth){ cv.width=vd.videoWidth; cv.height=vd.videoHeight; cx.drawImage(vd,0,0); const im=cx.getImageData(0,0,cv.width,cv.height); txt=window.jsQR(im.data,im.width,im.height)?.data||null; } }catch{}
      if(txt){ let code=null; try{ code=new URL(txt).searchParams.get('t'); }catch{ if(/^\d{1,6}$/.test(txt)) code=txt; }
        if(code && findByCode(code)){ scanStop(); closeModal(); UI.kiosk={step:'code',code:String(code),pin:''}; kioskKey('ok'); return; }
        const m=$('#scan-msg'); if(m) m.textContent='هذا الكود مو بطاقة متطوع';
      }
      setTimeout(tick, 220); };
    tick();
  }catch(e){ const m=$('#scan-msg'); if(m) m.textContent='ما قدرنا نفتح الكاميرا. اسمح للمتصفح باستخدامها، أو اكتب رقمك يدوياً.'; }
}
function scanStop(){ if(SCAN){ SCAN.on=false; try{ SCAN.stream.getTracks().forEach(t=>t.stop()); }catch{} SCAN=null; } }

async function shrinkPhoto(file){
  const url=URL.createObjectURL(file);
  try{ const im=await new Promise((r,j)=>{ const i=new Image(); i.onload=()=>r(i); i.onerror=j; i.src=url; });
    const S0=360; const cv=document.createElement('canvas'); cv.width=S0; cv.height=S0; const x=cv.getContext('2d');
    const m=Math.min(im.width,im.height); x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,S0,S0);
    let q=.82, out=cv.toDataURL('image/jpeg',q); while(out.length>60000 && q>.4){ q-=.1; out=cv.toDataURL('image/jpeg',q); } return out;
  } finally { URL.revokeObjectURL(url); }
}

/* ---------- الذروات وطابور الاستراحة ---------- */
const peaks = () => (cfg().peaks||[]).slice().sort((a,b)=>peakTime(a)-peakTime(b));
function peakTime(p){ const [h,m]=String(p.time||'0:0').split(':').map(Number); const d=new Date(); d.setHours(h||0,m||0,0,0); return d.getTime(); }
function peakState(p){ const mins=(peakTime(p)-now())/60000; if(mins< -45) return 'past'; if(mins<=0) return 'live'; if(mins<=(p.lead||30)) return 'soon'; return 'later'; }
const peakSoon = zone => peaks().find(p=>p.zone===zone && ['soon','live'].includes(peakState(p)));
const breakQueue = zone => vols().filter(v=>v.breakReq && v.zone===zone && v.status==='active').sort((a,b)=>a.breakReq-b.breakReq);
const queuePos = vid => { const v=S.volunteers[vid]; const q=breakQueue(v?.zone); const i=q.findIndex(x=>x.id===vid); return i<0 ? q.length+1 : i+1; };
function canBreakNow(vid){
  const v=S.volunteers[vid]; if(!v || v.status!=='active') return {ok:false, reason:'state'};
  if(breakLeft(vid)<=0) return {ok:false, reason:'budget'};
  const pk=peakSoon(v.zone); if(pk) return {ok:false, reason:'peak', pk};
  if(!breakAllowed(vid)) return {ok:false, reason:'full'};
  const q=breakQueue(v.zone); if(q.length && q[0].id!==vid) return {ok:false, reason:'queue'};
  return {ok:true};
}
function requestBreak(vid, by){
  const c=canBreakNow(vid);
  if(c.ok){ setStatus(vid,'break',by); return {started:true}; }
  if(c.reason==='budget' || c.reason==='state') return c;
  const v=S.volunteers[vid]; if(!v.breakReq) put('volunteers',vid,{...v,breakReq:now()});
  return {...c, queued:true, pos:queuePos(vid)};
}
function cancelBreakReq(vid){ const v=S.volunteers[vid]; if(v?.breakReq){ const d={...v}; delete d.breakReq; put('volunteers',vid,d); } }

async function claimMission(mid, vid){
  if(!DB){ const m=S.missions[mid]; if(!m) return; const t=m.takers||[]; if(t.includes(vid)) return; if(m.status!=='open'||t.length>=m.need) return toast('سبقك زملاؤك، المهمة اكتملت','warn'); const nt=[...t,vid]; put('missions',mid,{...m,takers:nt,status:nt.length>=m.need?'full':'open'}); return toast('المهمة لك! توجّه لها الآن','ok'); }
  const ref=DB.collection('missions').doc(mid);
  try{
    const r=await DB.runTransaction(async tx=>{ const snap=await tx.get(ref); if(!snap.exists) return 'gone'; const m=snap.data(); const t=m.takers||[]; if(t.includes(vid)) return 'mine'; if(m.status!=='open' || t.length>=m.need) return 'full'; const nt=[...t,vid]; tx.update(ref,{takers:nt, status: nt.length>=m.need?'full':'open'}); return 'ok'; });
    if(r==='ok') toast('المهمة لك! توجّه لها الآن','ok'); else if(r==='full') toast('سبقك زملاؤك، المهمة اكتملت','warn'); else if(r==='gone') toast('المهمة لم تعد متاحة','warn');
  }catch(e){ onWriteErr(e); }
}

const firstInToday = vid => (idx().byV[vid]||[]).find(l=>l.type==='in' && l.at>=dayStart());
function shiftInfo(){
  const t=now(); const late=[], soon=[], over=[];
  vols().forEach(v=>{
    const s=hmToday(v.shiftStart), e=hmToday(v.shiftEnd);
    if(s && v.status==='idle' && !firstInToday(v.id)){ if(t>s+15*60000 && (!e || t<e)) late.push(v); else if(s>t && s-t<=30*60000) soon.push(v); }

  });
  return {late, soon, over};
}

function chalScore(type, mem){
  const ds=dayStart();
  if(type==='nolate'){ const late=mem.some(v=>breakLeft(v.id)<0); const h=mem.reduce((s,v)=>s+workedSince(v.id,ds),0)/3600000; return {score: late?0:100+h, val: late?'خرج من التحدي (تجاوز استراحة)':`${h.toFixed(1)} ساعة بدون أي تأخير`}; }
  if(type==='missions'){ const ids=new Set(mem.map(v=>v.id)); let n=0; missions().filter(m=>m.status==='done' && (m.doneAt||0)>=ds).forEach(m=>(m.takers||[]).forEach(x=>{ if(ids.has(x)) n++; })); return {score:n, val:`${n} مشاركة في مهام`}; }
  if(type==='praise'){ const n=mem.reduce((s,v)=>s+(idx().notesByV[v.id]||[]).filter(x=>(x.kind==='praise'||x.kind==='award') && x.at>=ds).length,0); return {score:n, val:`${n} إشادة ومكافأة`}; }
  if(type==='punctual'){ const w=mem.filter(v=>v.shiftStart); if(!w.length) return {score:0,val:'لا توجد ورديات'}; const ok=w.filter(v=>{ const f=firstInToday(v.id); return f && f.at<=hmToday(v.shiftStart)+5*60000; }).length; const pct=Math.round(ok/w.length*100); return {score:pct, val:`${pct}% حضروا في الوقت`}; }
  const h=mem.length ? mem.reduce((s,v)=>s+workedSince(v.id,ds),0)/mem.length/3600000 : 0; return {score:h, val:`${h.toFixed(1)} ساعة للفرد`};
}
function zoneRanking(){
  const type=cfg().challenge||'nolate';
  return zones().map(z=>{ const mem=vols().filter(v=>v.zone===z.id && v.status!=='idle'); const r=chalScore(type, mem); const avgP = mem.length ? Math.round(mem.reduce((s,v)=>s+gami(v.id).p,0)/mem.length) : 0; return {z, mem, ...r, avgP}; })
    .filter(x=>x.mem.length).sort((a,b)=>b.score-a.score || b.avgP-a.avgP);
}

function setBuddy(a, b){
  const A=S.volunteers[a]; if(!A) return;
  const clear = id => { if(id && S.volunteers[id]){ const d={...S.volunteers[id]}; delete d.buddy; put('volunteers',id,d); } };
  if(A.buddy && A.buddy!==b) clear(A.buddy);
  if(b){ const B=S.volunteers[b]; if(B?.buddy && B.buddy!==a) clear(B.buddy); put('volunteers',b,{...S.volunteers[b], buddy:a}); }
  const nA={...S.volunteers[a]}; if(b) nA.buddy=b; else delete nA.buddy; put('volunteers',a,nA);
}

async function claimLegend(lid, vid){
  const lg=LEGENDS.find(x=>x.id===lid); if(!lg) return;
  const apply = d => { const c=d?.claims||[]; if(c.some(x=>x.v===vid)) return null; if(c.length>=lg.max) return 'full'; return {...(d||{}), claims:[...c,{v:vid,at:now()}]}; };
  const win = () => { toast(`صار لك الملصق الأسطوري «${lg.t}»!`,'ok'); confetti(260); };
  if(!DB){ const r=apply(S.legend[lid]); if(r==='full') return toast('سبقوك! اكتمل عدد هذا الملصق','warn'); if(r){ put('legend',lid,r); win(); } return; }
  const ref=DB.collection('legend').doc(lid);
  try{
    const r=await DB.runTransaction(async tx=>{ const snap=await tx.get(ref); const x=apply(snap.exists?snap.data():null); if(x && x!=='full') tx.set(ref,{claims:x.claims}); return x; });

}

function confetti(n=140){
  try{ if(matchMedia('(prefers-reduced-motion: reduce)').matches) return; }catch{}
  const c=document.createElement('canvas'); c.className='confetti'; document.body.appendChild(c);
  const W=c.width=innerWidth, H=c.height=innerHeight; const x=c.getContext('2d');
  const cols=['#facc15','#0d5a70','#e11d48','#22c55e','#7c3aed','#f59e0b','#0ea5e9'];
  const P=Array.from({length:n},()=>({x:W/2+(Math.random()-.5)*W*.4, y:H*.4, vx:(Math.random()-.5)*16, vy:-Math.random()*15-5, s:6+Math.random()*7, r:Math.random()*6, vr:(Math.random()-.5)*.3, c:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0; (function f(){ x.clearRect(0,0,W,H); P.forEach(p=>{ p.vy+=.35; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); x.restore(); }); if(++t<170) requestAnimationFrame(f); else c.remove(); })();
}

/* ---------- التحقق من الموقع ---------- */
function distM(a,b){ const R=6371000, r=x=>x*Math.PI/180; const dLa=r(b.lat-a.lat), dLn=r(b.lng-a.lng); const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLn/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function getPos(){ return new Promise((res,rej)=>{ if(!navigator.geolocation) return rej({code:'nogeo'}); navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}), e=>rej({code:e.code===1?'denied':'fail'}), {enableHighAccuracy:true, timeout:15000, maximumAge:0}); }); }
const geoOn = () => !!(cfg().geo && typeof cfg().geo.lat==='number' && cfg().geo.required!==false);
async function geoCheck(){ const g=cfg().geo; const p=await getPos(); const d=distM(g,p); const allowed=(g.radius||300)+Math.min(p.acc||0,150); return {ok:d<=allowed, d:Math.round(d), acc:Math.round(p.acc||0)}; }
function parseLatLng(t){ const m=String(t||'').match(/(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/); return m ? {lat:+m[1], lng:+m[2]} : null; }

const dayKey = (t=now()) => { const d=new Date(t); return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'); };
const mealCfg = () => cfg().meal || {};

const stampHash = code => hash((S.config?.salt||'')+':stamp:'+code);
function mealState(vid){
  const v=S.volunteers[vid]; const m=mealCfg(); if(!v || !m.enabled) return {st:'off'};
  const today=dayKey();
  const rec = S.meals[vid+'_'+today];
  if(v.mealDay===today || rec) return {st:'used', at: rec?.at || v.mealAt};
  const f=firstInToday(vid); if(!f) return {st:'absent'};
  const need=(m.minHours||0)*3600000; const w=workedSince(vid, dayStart());
  if(w<need) return {st:'wait', left:need-w};
  if(m.from && m.to){ const a=hmToday(m.from), b=hmToday(m.to); if(now()<a) return {st:'early', from:m.from}; if(now()>b) return {st:'closed', to:m.to}; }
  return {st:'ready'};
}
async function redeemMeal(vid, code){
  const today=dayKey(); const m=mealCfg(); const v=S.volunteers[vid]; if(!v) return false;
  const st=stampHash(code);
  const doc={v:vid, day:today, at:now(), amount:m.amount||20, stamp:st, by:'vendor'};
  if(!DB){ if(S.secrets.__meal?.stampHash!==st) return false; put('meals', vid+'_'+today, doc); put('volunteers', vid, {...v, mealDay:today, mealAt:now()}); return true; }
  try{ await DB.collection('meals').doc(vid+'_'+today).set(doc); }catch(e){ return false; }
  put('volunteers', vid, {...S.volunteers[vid], mealDay:today, mealAt:now()}); return true;
}

function payStatus(vid, k=dayKey()){

const BRAND_COLORS=['#5A1712','#0d5a70','#1d4ed8','#6d28d9','#be185d','#b91c1c','#c2410c','#a16207','#15803d','#0f766e','#334155'];

function hexLum(h){ const m=String(h).replace('#',''); if(m.length!==6) return 0.2; const [r,g,b]=[0,2,4].map(i=>{ let c=parseInt(m.slice(i,i+2),16)/255; return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4); }); return 0.2126*r+0.7152*g+0.0722*b; }
let BRAND_SIG='';
function applyBrand(){
  const b=brandCfg(); const sig=JSON.stringify([b.color,b.theme,b.logo?1:0]); if(sig===BRAND_SIG) return; BRAND_SIG=sig;
  const root=document.documentElement;
  if(b.theme==='light'||b.theme==='dark') root.setAttribute('data-theme', b.theme); else root.removeAttribute('data-theme');
  const dark = b.theme==='dark' || (b.theme!=='light' && matchMedia('(prefers-color-scheme: dark)').matches);
  if(b.color){
    const c=b.color; const accent = dark ? `color-mix(in srgb, ${c} 65%, white)` : c;
    root.style.setProperty('--accent', accent);
    root.style.setProperty('--accent-soft', `color-mix(in srgb, ${c} ${dark?28:14}%, ${dark?'#142126':'#ffffff'})`);
    root.style.setProperty('--accent-ink', dark ? '#06141a' : (hexLum(c)>0.45?'#111111':'#ffffff'));
    const T = dark
      ? {'--bg':`color-mix(in srgb, ${c} 16%, #0d0a09)`, '--surface':`color-mix(in srgb, ${c} 20%, #161211)`, '--surface-2':`color-mix(in srgb, ${c} 26%, #1c1716)`, '--line':`color-mix(in srgb, ${c} 34%, #332b29)`, '--muted':`color-mix(in srgb, ${c} 16%, #b3a7a2)`}
      : {'--bg':`color-mix(in srgb, ${c} 5%, #f7f2ec)`, '--surface':'#fffdfa', '--surface-2':`color-mix(in srgb, ${c} 4%, #f8f3ed)`, '--line':`color-mix(in srgb, ${c} 12%, #e6ddd4)`, '--muted':`color-mix(in srgb, ${c} 14%, #6a5d57)`};
    Object.entries(T).forEach(([k,v])=>root.style.setProperty(k,v));
  } else { ['--accent','--accent-soft','--accent-ink','--bg','--surface','--surface-2','--line','--muted'].forEach(k=>root.style.removeProperty(k)); }
  let fav=document.querySelector('link[rel=icon]'); if(b.logo){ if(!fav){ fav=document.createElement('link'); fav.rel='icon'; document.head.appendChild(fav); } fav.href=b.logo; }
}

function readLogo(file){
  return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onerror=rej; fr.onload=()=>{ const im=new Image(); im.onerror=rej; im.onload=()=>{ const max=240; const k=Math.min(1,max/Math.max(im.width,im.height)); const cv=document.createElement('canvas'); cv.width=Math.round(im.width*k); cv.height=Math.round(im.height*k); const cx=cv.getContext('2d'); cx.drawImage(im,0,0,cv.width,cv.height);
    let sum=0,n=0; try{ const d=cx.getImageData(0,0,cv.width,cv.height).data; for(let i=0;i<d.length;i+=16){ if(d[i+3]>128){ sum+=(d[i]*0.3+d[i+1]*0.59+d[i+2]*0.11); n++; } } }catch{}
    const light = n>0 && sum/n>215 && n < (cv.width*cv.height/4)*0.85;
    let url=cv.toDataURL('image/png'); if(url.length>180000 && !light) url=cv.toDataURL('image/jpeg',0.85); res({url, light}); }; im.src=fr.result; }; fr.readAsDataURL(file); });
}

function nextCode(){ const codes=vols().map(v=>+v.code||0); return String(Math.max(1000,...codes)+1); }
function createVolunteer({name, phone='', role='متطوع', zone='', pin, ...extra}){
  const id=uid('v'); const code=nextCode(); pin = pin || randPin();
  put('volunteers', id, {...extra, name:name.trim(), phone:phone.trim(), role, zone, code, status:'idle', statusAt:now(), createdAt:now(), zoneAt:now()});
  put('secrets', code, {vid:id, pinHash:pinHash(pin,code), phone:phone.trim()});
  return {id, code, pin, name, phone};
}

let rq=false;
function scheduleRender(){ if(rq) return; rq=true; requestAnimationFrame(()=>{ rq=false; render(); }); }
function render(){
  applyBrand(); updateBalance(); if(S.config?.eventName) document.title=S.config.eventName;
  const app=$('#app');
  const oldTicker=app.querySelector('.ticker');
  const a=document.activeElement; const keep = a && a.id && app.contains(a) ? {id:a.id, val:a.value, s:a.selectionStart, e:a.selectionEnd} : null;
  const html=view(); const sticky=app.querySelector('[data-sticky]');
  if(sticky && html.includes(`data-sticky="${sticky.dataset.sticky}"`)){ if(UI.drawer) renderDrawer(); return; }
  app.innerHTML = html;
  if(keep){ const el=document.getElementById(keep.id); if(el){ if('value' in el && keep.val!=null && el.tagName!=='SELECT' && el.type!=='checkbox') el.value=keep.val; el.focus(); try{ el.setSelectionRange(keep.s,keep.e); }catch{} } }
  if(UI.drawer) renderDrawer();
  if(oldTicker){ const nt=app.querySelector('.ticker'); if(nt && nt.dataset.sig===oldTicker.dataset.sig) nt.replaceWith(oldTicker); }
  const lu=app.querySelector('.lvlup'); if(lu){ const k=getSes()?.id+':'+(lu.querySelector('h2')?.textContent||''); if(FX.lvl!==k){ FX.lvl=k; confetti(220); } }

}
function view(){
  if(!S.ready) return `<div class="loader"><div class="spin"></div><div>${S.slow ? 'تعذّر الوصول للبيانات حتى الآن، تحقق من الاتصال…' : 'جارٍ تحميل المنصة…'}</div></div>`;
  if(THX) return thanksPage();
  const ses=getSes();
  if(!S.config){ if(FB_ON && !AUTH.admin) return landingView(); return setupView(); }
  if(ses?.role==='vol-wait') return `<div class="loader"><div class="spin"></div><div>جارٍ تحميل حسابك…</div></div>`;

const kpi = (v,l,c) => `<div class="kpi" style="--k:${c}"><span class="v">${v}</span><span class="l">${l}</span></div>`;
function zoneCard(s){
  const z=s.z, cr=z.crowd??1; const pct = s.need ? Math.min(100, Math.round(s.active.length/s.need*100)) : 100;

    <div class="zone-head"><div><h3><span class="zdot"></span>${esc(z.name)}</h3>${leads.length?`<div class="tiny muted">القائد: ${esc(leads.join('، '))}</div>`:''}</div>${gapPill}</div>
    <div class="staff"><span class="big">${s.active.length}</span><span class="muted">/ ${s.need} مطلوب</span></div>

    ${(()=>{ const h=handoversOf(z.id)[0]; return h && now()-h.at<12*3600000 ? `<div class="handover"><span class="tiny muted">آخر تسليم · ${ago(h.at)}</span><div>${esc(h.text)}</div></div>`:''; })()}
    <div class="row small muted"><span>${ic('coffee')} ${s.onBreak.length} استراحة</span><span>· ${s.idle.length} لم يحضر</span><span>· المستهدف ${z.target}</span></div>

    <div class="row">${s.gap>0?`<button class="btn sm primary grow" data-act="pull" data-z="${esc(z.id)}">${ic('move')} أرسل دعم (${s.gap})</button>`:''}<button class="btn sm grow" data-act="goto-zone" data-z="${esc(z.id)}">عرض الفريق</button></div>
  </div></article>`;
}

function reportsData(){
  return vols().map(v=>{ const b=breakStats(v.id); const n=idx().notesByV[v.id]||[]; return {v, ms:workedMs(v.id), breaks:b.n, breakMs:b.ms, praise:n.filter(x=>x.kind==='praise').length, warn:n.filter(x=>x.kind==='warn').length, r:rating(v.id)}; });
}
function reportsView(){
  const rows=reportsData();
  const sortKey={hours:r=>-r.ms, rating:r=>-(r.r||0), name:r=>r.v.name, breaks:r=>-r.breaks}[UI.sort]||(r=>-r.ms);
  rows.sort((a,b)=>{ const x=sortKey(a), y=sortKey(b); return typeof x==='string'?x.localeCompare(y,'ar'):x-y; });
  const total=rows.reduce((s,r)=>s+r.ms,0); const attended=rows.filter(r=>r.v.status!=='idle').length;

      ${top.length?`<div class="list">${top.map((r,i)=>`<div class="li click" data-act="open-vol" data-id="${r.v.id}"><span class="num muted" style="width:16px">${i+1}</span><span class="av" style="--zc:${zColor(r.v.zone)}">${esc(initials(r.v.name))}</span><div class="grow"><div class="t">${esc(r.v.name)}</div><div class="s">${esc(zName(r.v.zone))} · ${fmtDur(r.ms)}</div></div>${stars(r.r)}</div>`).join('')}</div>`:'<div class="empty">تظهر هنا قائمة المتميزين بعد بدء العمل.</div>'}
    </section>

      <div class="tbl-wrap"><table><thead><tr><th>الزون</th><th>الفريق</th><th>حضروا</th><th>الساعات</th></tr></thead><tbody>

    </tbody></table></div>
  </section>`;
}
function csv(){
  const rows=reportsData(); const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const head=['الاسم','الرقم','الجوال','الدور','الزون','الحالة','ساعات العمل','عدد الاستراحات','دقائق الاستراحة','إشادات','تنبيهات','التقييم','وقت الحضور','وقت الانصراف'];
  const lines=rows.map(r=>[r.v.name,r.v.code,r.v.phone,r.v.role,zName(r.v.zone),STATUS[r.v.status].t,(r.ms/3600000).toFixed(2),r.breaks,Math.round(r.breakMs/60000),r.praise,r.warn,r.r?r.r.toFixed(1):'',r.v.checkInAt?fmtTime(r.v.checkInAt):'',r.v.outAt?fmtTime(r.v.outAt):''].map(q).join(','));
  return '﻿'+[head.map(q).join(','),...lines].join('\n');
}

function kioskView(){
  const k=UI.kiosk; const c=cfg();
  let inner='';
  if(k.step==='code' || k.step==='pin'){
    const val = k.step==='code' ? k.code : k.pin; const len = k.step==='code' ? 4 : 6;
    inner = `${k.step==='code'?openLost().map(x=>`<div class="lost-banner" style="text-align:start"><b>${ic('eye')} ${LOST_T[x.kind]}: ${esc(x.desc)}</b><span class="small">آخر مشاهدة: ${esc(zName(x.zone))} · ${ago(x.at)}. إذا شفته بلّغ المشرف فوراً.</span></div>`).join(''):''}<div><h1>${k.step==='code'?'أدخل رقم المتطوع':'أدخل الرمز السري'}</h1><p class="muted">${k.step==='code'?'الرقم المكوّن من 4 أرقام في بطاقتك':'رقم '+esc(k.code)}</p></div>
      ${k.msg?`<div class="pill crit nodot" style="justify-self:center;padding:6px 14px">${esc(k.msg)}</div>`:''}
      <div class="pinshow">${Array.from({length:Math.max(len,val.length)}).map((_,i)=>`<i class="${i<val.length?'f':''}">${i<val.length?(k.step==='pin'?'•':esc(val[i])):''}</i>`).join('')}</div>
      <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-act="kp" data-k="${n}">${n}</button>`).join('')}<button class="fn" data-act="kp" data-k="back">مسح</button><button data-act="kp" data-k="0">0</button><button class="fn" data-act="kp" data-k="ok" style="background:var(--accent);color:var(--accent-ink)">التالي</button></div>
      ${k.step==='pin'?`<button class="btn ghost" data-act="kp-reset">رجوع</button>`:`<button class="btn lg" data-act="scan">${ic('qr')} أو امسح بطاقتك</button>`}`;
  } else if(k.step==='act'){
    const v=S.volunteers[k.vid]; if(!v){ UI.kiosk={step:'code',code:'',pin:'',vid:null}; return kioskView(); }
    const S0=STATUS[v.status]; const z=zoneById(v.zone);
    inner = `<div class="stack" style="gap:6px">${avatar(k.vid,'av kav')}<h1>أهلاً ${esc(v.name.split(' ')[0])}</h1>
      <div class="row" style="justify-content:center"><span class="pill ${S0.c}">${S0.t}</span><span class="pill accent nodot">${esc(z?z.name:'بدون زون')}</span></div>
      <p class="muted small" style="margin:0">${v.status==='break'?`في الاستراحة منذ ${fmtDur(now()-v.breakAt)} · `:''}${leftTxt(breakLeft(k.vid))}</p>
      ${(()=>{ const g=gami(k.vid); return `<div class="row" style="justify-content:center"><b class="num">${g.p} نقطة</b>${levelPill(g.level)}${flameHtml(g.streak)}</div>${g.boxAvail?`<button class="btn" style="background:linear-gradient(135deg,#7c3aed,#db2777);color:#fff;border:0" data-act="box-open" data-id="${k.vid}">${ic('gift')} عندك ${g.boxAvail} صندوق مفاجآت! افتحه</button>`:''}`; })()}${goldBanner(v.zone)}</div>
      <div class="bigact">
        ${v.status==='idle'||v.status==='out'?`<button class="btn ok" data-act="k-do" data-s="active">${ic('in')} تسجيل حضور</button>`:''}
        ${v.status==='active'?(()=>{ const cb=canBreakNow(k.vid); const lbl = v.breakReq ? (cb.ok?'دورك! ابدأ الاستراحة':`أنت رقم ${queuePos(k.vid)} في طابور الاستراحة`) : 'بدء استراحة'; return `<button class="btn warn" data-act="k-do" data-s="break" ${v.breakReq&&!cb.ok?'disabled':''}>${ic('coffee')} ${lbl}</button>${v.breakReq&&!cb.ok?`<p class="small muted" style="margin:0">${BREAK_WHY[cb.reason]||''}</p>`:''}<button class="btn" data-act="k-do" data-s="out">${ic('out')} تسجيل انصراف</button>`; })():''}
        ${v.status==='break'?`<button class="btn ok" data-act="k-do" data-s="active">${ic('check')} عودة من الاستراحة</button><button class="btn" data-act="k-do" data-s="out">${ic('out')} تسجيل انصراف</button>`:''}
        <button class="btn ghost" data-act="kp-reset">إلغاء</button>
      </div>`;
  } else if(k.step==='energy'){
    inner = `<div><h1>كيف طاقتك الآن؟</h1><p class="muted">يساعدنا نوزّع الاستراحات بعدل</p></div>
      <div class="epick">${[3,2,1].map(l=>`<button class="btn lg" data-act="k-energy" data-l="${l}">${energyBar(l).replace('class="energy','style="transform:scale(1.8);margin:6px" class="energy')}<span>${ENERGY[l].t}</span></button>`).join('')}</div>
      <button class="btn ghost" data-act="k-energy" data-l="0">تخطي</button>`;
  } else if(k.step==='done'){
    inner = `<div class="stack" style="gap:10px"><span style="justify-self:center;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:${k.ok?'var(--ok-soft)':'var(--warn-soft)'};color:${k.ok?'var(--ok)':'var(--warn)'}">${ic(k.ok?'check':'alert','icon" style="width:40px;height:40px')}</span><h1>${esc(k.title)}</h1><p class="muted" style="font-size:1.1rem">${esc(k.msg||'')}</p></div>
      ${k.lu?`<div class="gold-banner" style="justify-content:center">${ic('trophy')} ترقية! وصلت المستوى ${esc(k.lu)}</div>`:''}
      <button class="btn primary lg" data-act="kp-reset">تم</button>`;
  }
  if(emActive()) return emergencyScreen(null) + `<button class="btn sm" style="position:fixed;top:12px;left:12px;z-index:96" data-act="kiosk-exit">خروج المشرف</button>`;
  if(k.step==='code' || k.step==='pin') inner = `${goldBanner()}${inner}${tickerHtml()}`;
  return `<div class="kiosk"><div class="kiosk-top"><div class="row" style="gap:10px;flex-wrap:nowrap">${logoSm()}<div><b class="num" style="font-family:var(--font-display)">${esc(c.eventName)}</b><div class="tiny muted">نقطة تسجيل الحضور والانصراف</div></div></div><div class="row"><span class="num muted">${fmtTime(now())}</span>${TTS?`<button class="btn sm ghost" data-act="voice-toggle" aria-pressed="${voiceOn()}" aria-label="الترحيب الصوتي">${ic('speaker')} ${voiceOn()?'الصوت يعمل':'الصوت مغلق'}</button>`:''}<button class="btn sm ghost" data-act="kiosk-exit">خروج المشرف</button></div></div>
    <div class="kiosk-body"><div class="kpanel">${inner}</div></div></div>`;
}
let kTimer=null;
function kioskDone(ok,title,msg,lu){ UI.kiosk={step:'done',ok,title,msg,lu,code:'',pin:'',vid:null}; scheduleRender(); clearTimeout(kTimer); kTimer=setTimeout(()=>{ if(UI.kiosk.step==='done'){ UI.kiosk={step:'code',code:'',pin:''}; scheduleRender(); } }, 6000); }
function kioskKey(k){
  const s=UI.kiosk; const field = s.step==='code' ? 'code' : 'pin'; s.msg=null;
  if(k==='back'){ s[field]=s[field].slice(0,-1); }
  else if(k==='ok'){
    if(s.step==='code'){ const v=findByCode(s.code); if(!v){ s.msg='الرقم غير مسجل'; s.code=''; } else { s.step='pin'; } }
    else { const v=findByCode(s.code); if(v && secretOf(v)?.pinHash===pinHash(s.pin, v.code)){ s.vid=v.id; s.step='act'; s.pin=''; } else { s.msg='الرمز غير صحيح'; s.pin=''; } }
  } else if(s[field].length<8){ s[field]+=k; if(s.step==='pin' && s.pin.length===6){ scheduleRender(); setTimeout(()=>kioskKey('ok'),120); return; } }
  scheduleRender();
}
function kioskDo(status){
  const vid=UI.kiosk.vid; const v=S.volunteers[vid]; if(!v) return;
  if(status==='break'){
    const r=requestBreak(vid,'kiosk');
    if(r.reason==='budget') return kioskDone(false,'انتهى رصيد استراحتك اليوم',`رصيد الاستراحة ${allowMin()} دقيقة يومياً. لو تحتاج استراحة راجع المشرف.`);
    if(r.queued) return kioskDone(true,`أنت رقم ${r.pos} في طابور الاستراحة`,`${BREAK_WHY[r.reason]}${r.pk?` (${r.pk.title} الساعة ${r.pk.time})`:''}. بنعطيك الدور أول ما يتوفر من يغطي مكانك، تابع من جوالك أو ارجع هنا.`);
    return kioskDone(true,'استراحة موفقة',`باقي لك ${fmtDur(breakLeft(vid))} من رصيد استراحة اليوم. لا تنسَ تسجيل العودة.`);
  }
  const wasBreak=v.status==='break', wasIdle=v.status==='idle'||v.status==='out';
  const firstToday = wasIdle && !(idx().byV[vid]||[]).some(l=>l.type==='in' && l.at>=dayStart());
  setStatus(vid,status,'kiosk');
  const z=zName(v.zone);
  const first=v.name.split(' ')[0];
  const luL=ackLevel(vid); const lu=luL?luL.t:null; if(lu) setTimeout(()=>say(`مبروك يا ${first}! وصلت المستوى ${lu}`), 2500);
  const bud=v.buddy&&S.volunteers[v.buddy]; const budTxt = bud ? ` رفيقك اليوم: ${bud.name} (${STATUS[bud.status].t}).` : '';
  if(status==='active'){
    const left=breakLeft(vid); const h=handoversOf(v.zone)[0]; const hoTxt = !wasBreak && h && now()-h.at<12*3600000 ? ` ملاحظة التسليم: ${h.text}` : '';
    const title = wasBreak?'أهلاً بعودتك':'تم تسجيل حضورك';
    const msg = (wasBreak ? (left>=0?`رجعت في الوقت +${PTS.ontime} نقاط. باقي ${fmtDur(left)} من رصيدك. توجّه إلى: ${z}`:`تجاوزت رصيد الاستراحة بـ ${fmtDur(-left)}. توجّه إلى: ${z}`) : `${firstToday?`+${PTS.checkin} نقاط حضور. `:''}توجّه إلى: ${z}.`) + hoTxt;
    say(wasBreak ? `أهلاً بعودتك يا ${first}` : `أهلاً ${first}، حياك الله. توجّه إلى ${z}`);
    UI.kiosk={step:'energy', vid, title, msg: msg+(wasBreak?'':budTxt), lu, code:'', pin:''}; scheduleRender(); clearTimeout(kTimer); kTimer=setTimeout(()=>{ if(UI.kiosk.step==='energy'){ kioskDone(true, UI.kiosk.title, UI.kiosk.msg, UI.kiosk.lu); } }, 20000); return;
  }
  else if(status==='break'){ say(`استراحة موفقة يا ${first}`); kioskDone(true,'استراحة موفقة',`باقي لك ${fmtDur(breakLeft(vid))} من رصيد استراحة اليوم. لا تنسَ تسجيل العودة.`, lu); }
  else { say(`شكراً لعطائك يا ${first}`); kioskDone(true,'شكراً لعطائك','تم تسجيل انصرافك. نراك قريباً', lu); }
}

انتبه لـ: الزونات اللي ينقصها متطوعين مقارنة بالاحتياج، الذروات القريبة، تجاوز رصيد الاستراحة، الإرهاق (عمل متواصل طويل)، البلاغات المفتوحة، المهام الفورية المعلقة، طابور الاستراحة.
لا تتجاوز 170 كلمة إلا إذا طُلب تقرير.`;
function aiSnapshot(){
  const c=cfg();
  return JSON.stringify({
    الفعالية:c.eventName, الوقت_الآن:fmtTime(now()), رصيد_الاستراحة_اليومي_بالدقائق:allowMin(), طوارئ:emActive()?EM_T[c.emergency.type]:'لا', الساعة_الذهبية:goldNow()?`مفعّلة ${goldNow().zone?'في '+zName(goldNow().zone):'للجميع'}`:'لا',
    الزونات:zoneStats().map(s=>({الاسم:s.z.name, الزحمة:CROWD[s.z.crowd??1].t, المستهدف:s.z.target, الاحتياج_الآن:s.need, حاضر:s.active.length, في_استراحة:s.onBreak.length, لم_يحضر:s.idle.length})),
    الذروات:peaks().filter(p=>peakState(p)!=='past').map(p=>({العنوان:p.title, الساعة:p.time, الزون:zName(p.zone), المتوقع:CROWD[p.level??2].t, الحالة:{soon:'قريبة',live:'جارية',later:'لاحقاً'}[peakState(p)]})),
    المتطوعون:vols().slice(0,300).map(v=>{ const o={الاسم:v.name, الزون:zName(v.zone), الدور:v.role, الحالة:STATUS[v.status].t};
      if(v.status==='active') o.يعمل_متواصل_دقائق=Math.round((now()-(v.activeSince||now()))/60000);
      if(v.status==='active'||v.status==='break') o.باقي_رصيد_الاستراحة_دقائق=Math.round(breakLeft(v.id)/60000);
      if(v.breakReq) o.في_طابور_الاستراحة=true; if(v.energy && now()-v.energy.at<4*3600000) o.الطاقة=ENERGY[v.energy.v].t; const g=gami(v.id); o.النقاط=g.p; o.ساعات_العمل=+(g.w/3600000).toFixed(1); const r=rating(v.id); if(r) o.التقييم=+r.toFixed(1);
      const w=(idx().notesByV[v.id]||[]).filter(n=>n.kind==='warn').length; if(w) o.تنبيهات=w; return o; }),
    البلاغات_المفتوحة:Object.values(S.alerts).filter(a=>!a.resolved).map(a=>({النوع:ALERT_T[a.type]?.t, الزون:zName(a.zone), النص:a.text, منذ_دقائق:Math.round((now()-a.at)/60000)})),
    المهام_الفورية:liveMissions().map(m=>({المهمة:m.title, الزون:zName(m.zone), المطلوب:m.need, قبلها:(m.takers||[]).length})),
    المفقودات_المفتوحة:openLost().map(x=>({النوع:LOST_T[x.kind], الوصف:x.desc, آخر_مشاهدة:zName(x.zone)})),
    متأخرون_عن_الوردية:shiftInfo().late.map(v=>({الاسم:v.name, الزون:zName(v.zone), بداية_الوردية:v.shiftStart})),
    الاحتياط_المتاح:reserves().map(v=>v.name),
    ملاحظات_التسليم_الأخيرة:handoversOf().slice(0,6).map(h=>({الزون:zName(h.zone), النص:h.text})),
    تحدي_الزونات:zoneRanking().map(x=>({الفريق:x.z.name, النتيجة:x.val})),
    اقتراحات_النقل_المحسوبة:suggestions().map(m=>({المتطوع:S.volunteers[m.vid]?.name, من:zName(m.from), إلى:zName(m.to)})),
  });
}
function mdLite(t){
  const lines=esc(t).split('\n'); let out='', list=false;
  for(let l of lines){
    l=l.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    const m=l.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)/);
    if(m){ if(!list){ out+='<ul>'; list=true; } out+=`<li>${m[1]}</li>`; continue; }
    if(list){ out+='</ul>'; list=false; }
    if(/^#{1,4}\s/.test(l)) out+=`<h4>${l.replace(/^#+\s/,'')}</h4>`; else if(l.trim()) out+=`<p>${l}</p>`;
  }
  if(list) out+='</ul>'; return out;
}

function renderAI(){
  const el=$('#ai-log'); if(!el) return;

    : `<p class="small muted" style="margin:0">المساعد يقرأ وضع الفعالية الآن (الزونات، الاستراحات، الذروات، البلاغات، المهام) ويقترح عليك وش تسوي بالأسماء.</p>`;

async function askAI(q, kind){
  if(!q || AI.busy) return;
  if(!SAMPLE) return toast('المساعد يشتغل في الرابط المنشور فقط','warn');
  const history=AI.msgs.slice(-4).map(m=>(m.role==='user'?'سؤال المشرف: ':'ردك السابق: ')+m.text).join('\n\n');
  AI.msgs.push({role:'user',text:q}); const a={role:'assistant',text:''}; AI.msgs.push(a); AI.busy=true; renderAI();
  const prompt=`${AI_SYS}\n\nبيانات الفعالية الآن:\n${aiSnapshot()}\n\n${history?'المحادثة السابقة:\n'+history+'\n\n':''}طلب المشرف الآن: ${q}`;
  try{ const r=await SAMPLE(prompt,{cache:false, modelTier:kind==='report'?'complex':'default', onText:({text})=>{ a.text=text; renderAI(); }}); a.text=r.text||a.text; }
  catch(e){ a.text = e?.code==='rate_limited' ? 'طلبات كثيرة في وقت قصير، انتظر دقيقة وحاول.' : e?.code==='not_granted' ? 'المساعد غير مفعّل لهذا الحساب.' : (e?.text || 'تعذر الوصول للمساعد. حاول مرة ثانية.'); }
  AI.busy=false; renderAI();
}

/* ---------- الشهادة ---------- */
function drawIcon(ctx, name, cx, cy, size){
  const svg=IC[name]||''; ctx.save(); ctx.translate(cx-size/2, cy-size/2); ctx.scale(size/24,size/24); ctx.lineWidth=2; ctx.lineCap='round'; ctx.lineJoin='round';
  for(const m of svg.matchAll(/<(path|circle|rect)([^>]*)\/>/g)){
    const a=Object.fromEntries([...m[2].matchAll(/(\w+)="([^"]*)"/g)].map(x=>[x[1],x[2]]));
    if(m[1]==='path') ctx.stroke(new Path2D(a.d));
    else if(m[1]==='circle'){ ctx.beginPath(); ctx.arc(+a.cx,+a.cy,+a.r,0,Math.PI*2); ctx.stroke(); }
    else { const p=new Path2D(); if(p.roundRect) p.roundRect(+a.x,+a.y,+a.width,+a.height,+(a.rx||0)); else p.rect(+a.x,+a.y,+a.width,+a.height); ctx.stroke(p); }
  }
  ctx.restore();
}
function daysOf(vid){ return new Set((idx().byV[vid]||[]).filter(l=>l.type==='in').map(l=>dayKey(l.at))).size; }

  const stats=[[`${(g.w/3600000).toFixed(1)}`,'ساعة تطوع'],[`${daysOf(vid)}`,'يوم حضور'],[g.level.t,'المستوى'],[`${g.badges.length}`,'ملصق إنجاز']];
  const bw=250, gap=30, sx=W/2-(stats.length*bw+(stats.length-1)*gap)/2;

async function bulkDelete(cols){
  if(!DB){ for(const c of cols){ for(const id of Object.keys(S[c])) del(c,id); } toast('تم','ok'); return; }
  openModal(`<div class="modal-b" style="text-align:center;padding:28px"><div class="spin" style="margin:auto"></div><b>جارٍ الحذف… لا تسكرين الصفحة</b><div class="small muted" id="del-prog"></div></div>`);
  let n=0;
  for(const c of cols){ let snap; try{ snap=await DB.collection(c).get(); }catch(e){ continue; }
    for(let i=0;i<snap.docs.length;i+=400){ const b=DB.batch(); snap.docs.slice(i,i+400).forEach(d=>b.delete(d.ref)); await b.commit().catch(onWriteErr); n+=Math.min(400,snap.docs.length-i); const pg=$('#del-prog'); if(pg) pg.textContent=`تم حذف ${n}`; }
    S[c]={}; }
  invalidate(); closeModal(); toast('تم الحذف','ok');
}

  if(el.dataset.change==='payDay'){ UI.payDay=el.value; scheduleRender(); }
  if(el.dataset.pay){ const k=el.dataset.pay; const c=cfg(); put('config','main',{...c, allowance:{...(c.allowance||{}), [k]:Math.max(0,+el.value||0)}}); toast('تم الحفظ','ok'); }
  if(el.dataset.meal){ const k=el.dataset.meal; let val=el.value; if(k==='amount'||k==='minHours') val=Math.max(0,+val||0); const c=cfg(); put('config','main',{...c, meal:{...(c.meal||{}), [k]:val}}); toast('تم الحفظ','ok'); }
  if('geoLink' in el.dataset){ const ll=parseLatLng(el.value); if(!ll) return toast('ما لقيت إحداثيات في الرابط. انسخ الإحداثيات من قوقل ماب (اضغط مطولاً على المكان)','warn'); const c=cfg(); put('config','main',{...c, geo:{...(c.geo||{}), ...ll, radius:c.geo?.radius||300, required:c.geo?.required!==false}}); el.value=''; toast('تم حفظ موقع الفعالية','ok'); }
  if('geoR' in el.dataset){ const r=Math.max(50,Math.min(3000,+el.value||300)); const c=cfg(); put('config','main',{...c, geo:{...(c.geo||{}), radius:r}}); toast('تم الحفظ','ok'); }
  if(el.dataset.change==='buddy'){ setBuddy(el.dataset.id, el.value); toast(el.value?`صار ${S.volunteers[el.value]?.name} رفيقه`:'تم فك الثنائي','ok'); }
  if(el.dataset.change==='move'){ moveVol(el.dataset.id, el.value); toast(`تم النقل إلى ${zName(el.value)}`,'ok'); }
  if(el.dataset.cfg){ let val=el.value; if('num' in el.dataset){ val=+val; if(!val) return; } put('config','main',{...cfg(),[el.dataset.cfg]:val}); toast('تم الحفظ','ok'); }
  if(el.dataset.zone){ const k=el.dataset.k; let val=el.value; if(k==='target') val=Math.max(0,+val||0); else if(!val.trim()) return; const c=cfg(); put('config','main',{...c,zones:c.zones.map(z=>z.id===el.dataset.zone?{...z,[k]:val}:z)}); toast('تم الحفظ','ok'); }
});
